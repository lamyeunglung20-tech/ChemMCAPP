                { questionZh: '下列哪種或哪些濃酸通常貯存於棕色的瓶子中？\n(1) 氫氯酸\n(2) 硝酸\n(3) 硫酸', questionEn: 'Which of the following concentrated acids is/are usually stored in brown bottles?\n(1) Hydrochloric acid\n(2) Nitric acid\n(3) Sulphuric acid', optionsZh: ['只有(1)', '只有(2)', '只有(1)和(3)', '只有(2)和(3)'], optionsEn: ['(1) only', '(2) only', '(1) and (3) only', '(2) and (3) only'], answer: 1, explanationZh: '濃硝酸在光照下會分解產生二氧化氮氣體，因此必須儲存在棕色瓶中避光。', explanationEn: 'Concentrated nitric acid decomposes under light to produce nitrogen dioxide gas, so it must be stored in brown bottles to block light.' },
                { questionZh: '下列哪個危險警告標籤應貼在一瓶濃氫氯酸上？', questionEn: 'Which of the following hazard warning labels should be displayed on a bottle of concentrated hydrochloric acid?', optionsZh: ['爆炸性', '易燃', '腐蝕性', '助燃'], optionsEn: ['Explosive', 'Flammable', 'Corrosive', 'Oxidizing'], answer: 2, explanationZh: '濃氫氯酸具有強烈的腐蝕性，能嚴重灼傷皮膚。', explanationEn: 'Concentrated hydrochloric acid is highly corrosive and can cause severe skin burns.' },
                { questionZh: '下列哪些危險警告標籤應貼在一瓶濃硫酸上？\n(1) 易燃\n(2) 有毒\n(3) 腐蝕性', questionEn: 'Which of the following hazard warning labels should be displayed on a bottle of concentrated sulphuric acid?\n(1) Flammable\n(2) Toxic\n(3) Corrosive', optionsZh: ['只有(1)和(2)', '只有(2)和(3)', '只有(1)和(3)', '(1)、(2)和(3)'], optionsEn: ['(1) and (2) only', '(2) and (3) only', '(1) and (3) only', '(1), (2) and (3)'], answer: 1, explanationZh: '濃硫酸具高度腐蝕性且有毒，但它本身不可燃。', explanationEn: 'Concentrated sulphuric acid is highly corrosive and toxic, but it is not flammable.' },
                { questionZh: '下列哪項或哪些有關固態氧化鈣的陳述正確？\n(1) 它很容易吸收氨。\n(2) 它很容易吸收二氧化碳。\n(3) 它很容易吸收水。', questionEn: 'Which of the following statements about solid calcium oxide is/are correct?\n(1) It easily absorbs ammonia.\n(2) It easily absorbs carbon dioxide.\n(3) It easily absorbs water.', optionsZh: ['只有(1)', '只有(2)', '只有(1)和(3)', '只有(2)和(3)'], optionsEn: ['(1) only', '(2) only', '(1) and (3) only', '(2) and (3) only'], answer: 3, explanationZh: '氧化鈣（生石灰）是鹼性氧化物，會吸收酸性的二氧化碳，也非常容易吸水（常作乾燥劑）。', explanationEn: 'Calcium oxide (quicklime) is a basic oxide that absorbs acidic carbon dioxide and is highly hygroscopic (absorbs water, used as a desiccant).' },
                { questionZh: '在進行實驗時，若某學生不慎讓稀氫氯酸濺入眼睛內，這學生應立刻', questionEn: 'If dilute hydrochloric acid gets into a student\'s eye during an experiment, the first thing the student should do is to', optionsZh: ['撥電話 999 求救。', '用水沖洗眼睛。', '用稀氨水沖洗眼睛。', '用稀氫氧化鈉溶液沖洗眼睛。'], optionsEn: ['dial 999 for help.', 'wash the eye with water.', 'wash the eye with dilute ammonia solution.', 'wash the eye with dilute sodium hydroxide solution.'], answer: 1, explanationZh: '化學品濺入眼睛時，首要急救措施是立刻用大量清水沖洗，絕不可用鹼性溶液中和，以免造成二次傷害。', explanationEn: 'The immediate first aid for chemicals in the eye is to wash with plenty of water. Never use alkalis to neutralize, as it can cause further damage.' },
                { questionZh: '第一敘述句：如果濃氫氯酸滴在某人手上，他/她應立刻以濃氨溶液洗手。\n第二敘述句：濃氨溶液是弱鹼。', questionEn: '1st statement: If concentrated hydrochloric acid is dripped onto one\'s hand, one should wash the hand immediately with concentrated ammonia solution.\n2nd statement: Concentrated ammonia solution is a weak alkali.', optionsZh: ['兩敘述句均屬正確，而第二敘述句為第一敘述句的合理解釋。', '兩敘述句均屬正確，但第二敘述句並非第一敘述句的合理解釋。', '第一敘述句錯誤，但第二敘述句正確。', '兩敘述句均屬錯誤。'], optionsEn: ['Both statements are true and the 2nd statement is a correct explanation of the 1st statement.', 'Both statements are true but the 2nd statement is NOT a correct explanation of the 1st statement.', 'The 1st statement is false but the 2nd statement is true.', 'Both statements are false.'], answer: 2, explanationZh: '酸濺到皮膚應立即用大量清水沖洗，不可用濃氨水（本身具腐蝕性與刺激性）洗手。氨溶液確實是弱鹼。', explanationEn: 'Acid spills on the skin should be washed with plenty of water, not concentrated ammonia (which is corrosive). Ammonia solution is indeed a weak alkali.' },
                { questionZh: '第一敘述句：若某學生意外地將一些氫氯酸傾瀉在他的手上，他應立即用氫氧化鈉溶液洗手。\n第二敘述句：氫氧化鈉溶液能中和氫氯酸。', questionEn: '1st statement: If a student accidentally spills some hydrochloric acid on his hand, he should immediately wash his hand with sodium hydroxide solution.\n2nd statement: Sodium hydroxide solution can neutralize hydrochloric acid.', optionsZh: ['兩敘述句均屬正確，而第二敘述句為第一敘述句的合理解釋。', '兩敘述句均屬正確，但第二敘述句並非第一敘述句的合理解釋。', '只有一敘述句正確，而另一敘述句是錯誤的。', '兩敘述句均屬錯誤。'], optionsEn: ['Both statements are true and the 2nd statement is a correct explanation of the 1st statement.', 'Both statements are true but the 2nd statement is NOT a correct explanation of the 1st statement.', 'Only one statement is true while the other is false.', 'Both statements are false.'], answer: 2, explanationZh: '不可用氫氧化鈉（強鹼，具腐蝕性）洗手，應使用大量清水。氫氧化鈉確實能中和氫氯酸。', explanationEn: 'Do not wash hands with NaOH (a corrosive strong alkali); use plenty of water instead. NaOH does neutralize HCl.' }
            ],
            // 15.1 以mol表示溶液的濃度
            'acids_ch15_1': [
                { questionZh: '要製備 500 cm³ 的 2 M 硫酸溶液，所需的純硫酸質量是多少？\n(H = 1.0, O = 16.0, S = 32.0)', questionEn: 'What is the mass of pure sulphuric acid required to prepare 500 cm³ of a 2 M solution?\n(H = 1.0, O = 16.0, S = 32.0)', optionsZh: ['24.5 g', '49.0 g', '98.0 g', '196.0 g', '392.0 g'], optionsEn: ['24.5 g', '49.0 g', '98.0 g', '196.0 g', '392.0 g'], answer: 2, explanationZh: '摩爾數 = 濃度 × 體積 = 2 M × 0.5 dm³ = 1 mol。\n硫酸 (H₂SO₄) 的摩爾質量 = 2(1.0) + 32.0 + 4(16.0) = 98.0 g/mol。\n所需質量 = 1 mol × 98.0 g/mol = 98.0 g。', explanationEn: 'Moles = Concentration × Volume = 2 M × 0.5 dm³ = 1 mol.\nMolar mass of H₂SO₄ = 2(1.0) + 32.0 + 4(16.0) = 98.0 g/mol.\nMass required = 1 mol × 98.0 g/mol = 98.0 g.' },
                { questionZh: '1 dm³ 的 2 M 硫酸鈉溶液中有離子若干個？\n(亞佛加德羅常數 = 6 x 10²³)', questionEn: 'What is the total number of ions present in 1 dm³ of a 2 M sodium sulphate solution?\n(Avogadro number = 6 x 10²³)', optionsZh: ['6 x 10²³', '12 x 10²³', '18 x 10²³', '24 x 10²³', '36 x 10²³'], optionsEn: ['6 x 10²³', '12 x 10²³', '18 x 10²³', '24 x 10²³', '36 x 10²³'], answer: 4, explanationZh: '硫酸鈉 (Na₂SO₄) 的摩爾數 = 2 M × 1 dm³ = 2 mol。\n每摩爾 Na₂SO₄ 含有 3 摩爾離子 (2 個 Na⁺ 和 1 個 SO₄²⁻)。\n總離子摩爾數 = 2 mol × 3 = 6 mol。\n離子總數 = 6 × (6 × 10²³) = 36 × 10²³。', explanationEn: 'Moles of Na₂SO₄ = 2 M × 1 dm³ = 2 mol.\nEach mole of Na₂SO₄ contains 3 moles of ions (2 Na⁺ and 1 SO₄²⁻).\nTotal moles of ions = 2 mol × 3 = 6 mol.\nTotal number of ions = 6 × (6 × 10²³) = 36 × 10²³.' },
                { questionZh: '製備 250 cm³ 的 0.5 M 碳酸鈉溶液，需用多少無水碳酸鈉？\n(相對原子質量：C = 12, O = 16, Na = 23.0)', questionEn: 'How much anhydrous sodium carbonate would be required to prepare 250 cm³ of 0.5 M sodium carbonate solution?\n(Relative atomic masses: C = 12, O = 16, Na = 23.0)', optionsZh: ['5.30 g', '6.63 g', '13.25 g', '26.50 g', '53.00 g'], optionsEn: ['5.30 g', '6.63 g', '13.25 g', '26.50 g', '53.00 g'], answer: 2, explanationZh: '摩爾數 = 0.5 M × 0.25 dm³ = 0.125 mol。\n碳酸鈉 (Na₂CO₃) 的摩爾質量 = 2(23.0) + 12 + 3(16) = 106 g/mol。\n所需質量 = 0.125 mol × 106 g/mol = 13.25 g。', explanationEn: 'Moles = 0.5 M × 0.25 dm³ = 0.125 mol.\nMolar mass of Na₂CO₃ = 2(23.0) + 12 + 3(16) = 106 g/mol.\nMass required = 0.125 mol × 106 g/mol = 13.25 g.' },
                { questionZh: '在一含有硝酸鉀和硫酸鉀的溶液中，鉀離子和硝酸根離子的濃度分別是 0.5 M 和 0.2 M。硫酸根離子的濃度是多少？', questionEn: 'In a solution containing potassium nitrate and potassium sulphate, the concentrations of potassium ions and nitrate ions are 0.5 M and 0.2 M respectively. What is the concentration of sulphate ions?', optionsZh: ['0.10 M', '0.15 M', '0.20 M', '0.30 M'], optionsEn: ['0.10 M', '0.15 M', '0.20 M', '0.30 M'], answer: 1, explanationZh: '溶液中的 K⁺ 來自 KNO₃ 和 K₂SO₄。\n來自 KNO₃ 的 [K⁺] = [NO₃⁻] = 0.2 M。\n因此，來自 K₂SO₄ 的 [K⁺] = 總 [K⁺] - 來自 KNO₃ 的 [K⁺] = 0.5 M - 0.2 M = 0.3 M。\n由於 K₂SO₄ 解離出 2 個 K⁺ 和 1 個 SO₄²⁻，所以 [SO₄²⁻] = 0.3 M / 2 = 0.15 M。', explanationEn: 'K⁺ in the solution comes from KNO₃ and K₂SO₄.\n[K⁺] from KNO₃ = [NO₃⁻] = 0.2 M.\nTherefore, [K⁺] from K₂SO₄ = Total [K⁺] - [K⁺] from KNO₃ = 0.5 M - 0.2 M = 0.3 M.\nSince K₂SO₄ dissociates into 2 K⁺ and 1 SO₄²⁻, [SO₄²⁻] = 0.3 M / 2 = 0.15 M.' },
                { questionZh: '150.0 cm³ 的 3.0 M 氫氧化鈉溶液與 50.0 cm³ 的 1.0 M 氫氧化鈉溶液混和後，所得溶液的濃度是', questionEn: '150.0 cm³ of 3.0 M sodium hydroxide solution is mixed with 50.0 cm³ of 1.0 M sodium hydroxide solution. The concentration of the resultant solution is', optionsZh: ['2.0 M', '2.5 M', '3.3 M', '4.0 M'], optionsEn: ['2.0 M', '2.5 M', '3.3 M', '4.0 M'], answer: 1, explanationZh: '總摩爾數 = (3.0 M × 0.15 dm³) + (1.0 M × 0.05 dm³) = 0.45 mol + 0.05 mol = 0.5 mol。\n總體積 = 150.0 cm³ + 50.0 cm³ = 200.0 cm³ = 0.2 dm³。\n混合後濃度 = 0.5 mol / 0.2 dm³ = 2.5 M。', explanationEn: 'Total moles = (3.0 M × 0.15 dm³) + (1.0 M × 0.05 dm³) = 0.45 mol + 0.05 mol = 0.5 mol.\nTotal volume = 150.0 cm³ + 50.0 cm³ = 200.0 cm³ = 0.2 dm³.\nResultant concentration = 0.5 mol / 0.2 dm³ = 2.5 M.' },
                { questionZh: '要將 100 cm³ 的 2 M 氫氯酸稀釋為 0.2 M，需加入多少水？', questionEn: 'What volume of water should be added to 100 cm³ of 2 M hydrochloric acid to change the acid concentration to 0.2 M?', optionsZh: ['100 cm³', '500 cm³', '900 cm³', '1000 cm³'], optionsEn: ['100 cm³', '500 cm³', '900 cm³', '1000 cm³'], answer: 2, explanationZh: '設最終體積為 V₂。\nM₁V₁ = M₂V₂\n2 M × 100 cm³ = 0.2 M × V₂\nV₂ = 1000 cm³\n需加入的水體積 = 最終體積 - 初始體積 = 1000 cm³ - 100 cm³ = 900 cm³。', explanationEn: 'Let V₂ be the final volume.\nM₁V₁ = M₂V₂\n2 M × 100 cm³ = 0.2 M × V₂\nV₂ = 1000 cm³\nVolume of water added = Final volume - Initial volume = 1000 cm³ - 100 cm³ = 900 cm³.' },
                { questionZh: '在 0.1 dm³ 的 0.5 M Fe₂(SO₄)₃ 溶液中，Fe³⁺ 離子的摩爾數是', questionEn: 'What is the number of moles of Fe³⁺ ions in 0.1 dm³ of 0.5 M Fe₂(SO₄)₃ solution?', optionsZh: ['0.1 x 0.5', '2 x 0.1 x 0.5', '0.1 x 0.5 x 6.02 x 10²³', '2 x 0.1 x 0.5 x 6.02 x 10²³'], optionsEn: ['0.1 x 0.5', '2 x 0.1 x 0.5', '0.1 x 0.5 x 6.02 x 10²³', '2 x 0.1 x 0.5 x 6.02 x 10²³'], answer: 1, explanationZh: 'Fe₂(SO₄)₃ 的摩爾數 = 濃度 × 體積 = 0.5 M × 0.1 dm³。\n每摩爾 Fe₂(SO₄)₃ 含有 2 摩爾 Fe³⁺ 離子。\n因此，Fe³⁺ 離子的摩爾數 = 2 × (0.1 × 0.5)。', explanationEn: 'Moles of Fe₂(SO₄)₃ = Concentration × Volume = 0.5 M × 0.1 dm³.\nEach mole of Fe₂(SO₄)₃ contains 2 moles of Fe³⁺ ions.\nTherefore, moles of Fe³⁺ ions = 2 × (0.1 × 0.5).' },
                { questionZh: '若要將 100 cm³ 的 8 M 氫氯酸稀釋至 2 M 的濃度，需加入多少體積的水？', questionEn: 'What volume of water is required to dilute 100 cm³ of 8 M hydrochloric acid to a concentration of 2 M?', optionsZh: ['200 cm³', '300 cm³', '400 cm³', '700 cm³'], optionsEn: ['200 cm³', '300 cm³', '400 cm³', '700 cm³'], answer: 1, explanationZh: '設最終體積為 V₂。\nM₁V₁ = M₂V₂\n8 M × 100 cm³ = 2 M × V₂\nV₂ = 400 cm³\n需加入的水體積 = 最終體積 - 初始體積 = 400 cm³ - 100 cm³ = 300 cm³。', explanationEn: 'Let V₂ be the final volume.\nM₁V₁ = M₂V₂\n8 M × 100 cm³ = 2 M × V₂\nV₂ = 400 cm³\nVolume of water required = Final volume - Initial volume = 400 cm³ - 100 cm³ = 300 cm³.' },
                { questionZh: '把 11.7 g 的氯化鈉溶於蒸餾水中，以製備 2.0 M 的氯化鈉溶液。所生成溶液的體積是多少？\n(相對原子質量：Na = 23.0, Cl = 35.5)', questionEn: 'A 2.0 M sodium chloride solution is prepared by dissolving 11.7 g of sodium chloride in distilled water. What is the volume of the solution formed?\n(Relative atomic masses: Na = 23.0, Cl = 35.5)', optionsZh: ['50.0 cm³', '100.0 cm³', '250.0 cm³', '500.0 cm³'], optionsEn: ['50.0 cm³', '100.0 cm³', '250.0 cm³', '500.0 cm³'], answer: 1, explanationZh: '氯化鈉 (NaCl) 的摩爾質量 = 23.0 + 35.5 = 58.5 g/mol。\nNaCl 的摩爾數 = 11.7 g / 58.5 g/mol = 0.2 mol。\n體積 = 摩爾數 / 濃度 = 0.2 mol / 2.0 M = 0.1 dm³ = 100.0 cm³。', explanationEn: 'Molar mass of NaCl = 23.0 + 35.5 = 58.5 g/mol.\nMoles of NaCl = 11.7 g / 58.5 g/mol = 0.2 mol.\nVolume = Moles / Concentration = 0.2 mol / 2.0 M = 0.1 dm³ = 100.0 cm³.' },
                { questionZh: '某濃硫酸樣本的密度為 1.83 g cm⁻³，而它含硫酸的質量比為 94.0 %。在這樣本中，硫酸的濃度(準確至一位小數)是多少？\n(相對原子質量：H = 1.0, O = 16.0, S = 32.1)', questionEn: 'A sample of concentrated sulphuric acid has a density of 1.83 g cm⁻³ and contains 94.0 % of sulphuric acid by mass. What is the concentration (correct to one decimal place) of sulphuric acid in the sample?\n(Relative atomic masses: H = 1.0, O = 16.0, S = 32.1)', optionsZh: ['17.5 M', '18.3 M', '18.7 M', '19.8 M'], optionsEn: ['17.5 M', '18.3 M', '18.7 M', '19.8 M'], answer: 0, explanationZh: '假設有 1 dm³ (1000 cm³) 的溶液。\n溶液質量 = 1000 cm³ × 1.83 g/cm³ = 1830 g。\n硫酸 (H₂SO₄) 的質量 = 1830 g × 94.0% = 1720.2 g。\nH₂SO₄ 的摩爾質量 = 2(1.0) + 32.1 + 4(16.0) = 98.1 g/mol。\nH₂SO₄ 的摩爾數 = 1720.2 g / 98.1 g/mol ≈ 17.535 mol。\n濃度 = 17.535 mol / 1 dm³ ≈ 17.5 M。', explanationEn: 'Assume 1 dm³ (1000 cm³) of solution.\nMass of solution = 1000 cm³ × 1.83 g/cm³ = 1830 g.\nMass of H₂SO₄ = 1830 g × 94.0% = 1720.2 g.\nMolar mass of H₂SO₄ = 2(1.0) + 32.1 + 4(16.0) = 98.1 g/mol.\nMoles of H₂SO₄ = 1720.2 g / 98.1 g/mol ≈ 17.535 mol.\nConcentration = 17.535 mol / 1 dm³ ≈ 17.5 M.' },
                { questionZh: '500 cm³ 的氫氧化鈣溶液含有 3.7 g 的氫氧化鈣。這溶液的摩爾濃度是多少？\n(相對原子質量：H = 1.0, O = 16.0, Ca = 40.1)', questionEn: '500 cm³ of calcium hydroxide solution contains 3.7 g of calcium hydroxide. What is the molarity of the solution?\n(Relative atomic masses: H = 1.0, O = 16.0, Ca = 40.1)', optionsZh: ['0.05 M', '0.10 M', '0.13 M', '0.26 M'], optionsEn: ['0.05 M', '0.10 M', '0.13 M', '0.26 M'], answer: 1, explanationZh: '氫氧化鈣 (Ca(OH)₂) 的摩爾質量 = 40.1 + 2(16.0 + 1.0) = 74.1 g/mol。\n摩爾數 = 3.7 g / 74.1 g/mol ≈ 0.0499 mol。\n體積 = 500 cm³ = 0.5 dm³。\n摩爾濃度 = 0.0499 mol / 0.5 dm³ ≈ 0.10 M。', explanationEn: 'Molar mass of Ca(OH)₂ = 40.1 + 2(16.0 + 1.0) = 74.1 g/mol.\nMoles = 3.7 g / 74.1 g/mol ≈ 0.0499 mol.\nVolume = 500 cm³ = 0.5 dm³.\nMolarity = 0.0499 mol / 0.5 dm³ ≈ 0.10 M.' },
                { questionZh: '溶液 X 是由 100.0 cm³ 的 2.0 M Na₂SO₄(aq) 與 50.0 cm³ 的 1.0 M NaNO₃(aq) 混和而成的。在 X 中，Na⁺(aq) 離子的濃度是多少？', questionEn: 'Solution X is prepared by mixing 100.0 cm³ of 2.0 M Na₂SO₄(aq) with 50.0 cm³ of 1.0 M NaNO₃(aq). What is the concentration of Na⁺(aq) ions in X?', optionsZh: ['1.5 M', '1.7 M', '3.0 M', '3.3 M'], optionsEn: ['1.5 M', '1.7 M', '3.0 M', '3.3 M'], answer: 2, explanationZh: '來自 Na₂SO₄ 的 Na⁺ 摩爾數 = 2 × (2.0 M × 0.100 dm³) = 0.4 mol。\n來自 NaNO₃ 的 Na⁺ 摩爾數 = 1 × (1.0 M × 0.050 dm³) = 0.05 mol。\nNa⁺ 總摩爾數 = 0.4 mol + 0.05 mol = 0.45 mol。\n總體積 = 100.0 cm³ + 50.0 cm³ = 150.0 cm³ = 0.15 dm³。\nNa⁺ 濃度 = 0.45 mol / 0.15 dm³ = 3.0 M。', explanationEn: 'Moles of Na⁺ from Na₂SO₄ = 2 × (2.0 M × 0.100 dm³) = 0.4 mol.\nMoles of Na⁺ from NaNO₃ = 1 × (1.0 M × 0.050 dm³) = 0.05 mol.\nTotal moles of Na⁺ = 0.45 mol.\nTotal volume = 100.0 cm³ + 50.0 cm³ = 150.0 cm³ = 0.15 dm³.\nConcentration of Na⁺ = 0.45 mol / 0.15 dm³ = 3.0 M.' },
                { questionZh: '20 cm³ 的氯化鈣溶液含 1.0 x 10⁻² 摩爾的 Cl⁻(aq) 離子。這溶液的摩爾濃度是多少？', questionEn: '20 cm³ of calcium chloride solution contains 1.0 x 10⁻² moles of Cl⁻(aq) ions. What is the molarity of the solution?', optionsZh: ['1.0 x 10⁻⁴ M', '2.5 x 10⁻⁴ M', '2.5 x 10⁻¹ M', '5.0 x 10⁻¹ M'], optionsEn: ['1.0 x 10⁻⁴ M', '2.5 x 10⁻⁴ M', '2.5 x 10⁻¹ M', '5.0 x 10⁻¹ M'], answer: 2, explanationZh: '氯化鈣的化學式為 CaCl₂，每摩爾 CaCl₂ 解離出 2 摩爾 Cl⁻ 離子。\nCaCl₂ 的摩爾數 = (1.0 × 10⁻² mol) / 2 = 5.0 × 10⁻³ mol。\n體積 = 20 cm³ = 0.02 dm³。\n溶液的摩爾濃度 = (5.0 × 10⁻³ mol) / 0.02 dm³ = 0.25 M = 2.5 × 10⁻¹ M。', explanationEn: 'The formula for calcium chloride is CaCl₂, which dissociates into 2 moles of Cl⁻ ions per mole of CaCl₂.\nMoles of CaCl₂ = (1.0 × 10⁻² mol) / 2 = 5.0 × 10⁻³ mol.\nVolume = 20 cm³ = 0.02 dm³.\nMolarity of the solution = (5.0 × 10⁻³ mol) / 0.02 dm³ = 0.25 M = 2.5 × 10⁻¹ M.' },
                { questionZh: '把 20.0 cm³ 的 1.0 M NaCl(aq) 與 10.0 cm³ 的 2.0 M Na₂CO₃(aq) 混和。在所得溶液中，Na⁺(aq) 離子的濃度是多少？', questionEn: '20.0 cm³ of 1.0 M NaCl(aq) is mixed with 10.0 cm³ of 2.0 M Na₂CO₃(aq). What is the concentration of Na⁺(aq) ions in the resulting solution?', optionsZh: ['1.3 M', '1.5 M', '2.0 M', '3.0 M'], optionsEn: ['1.3 M', '1.5 M', '2.0 M', '3.0 M'], answer: 2, explanationZh: '來自 NaCl 的 Na⁺ 摩爾數 = 1.0 M × 0.020 dm³ = 0.02 mol。\n來自 Na₂CO₃ 的 Na⁺ 摩爾數 = 2 × (2.0 M × 0.010 dm³) = 0.04 mol。\nNa⁺ 總摩爾數 = 0.02 mol + 0.04 mol = 0.06 mol。\n總體積 = 20.0 cm³ + 10.0 cm³ = 30.0 cm³ = 0.03 dm³。\nNa⁺ 濃度 = 0.06 mol / 0.03 dm³ = 2.0 M。', explanationEn: 'Moles of Na⁺ from NaCl = 1.0 M × 0.020 dm³ = 0.02 mol.\nMoles of Na⁺ from Na₂CO₃ = 2 × (2.0 M × 0.010 dm³) = 0.04 mol.\nTotal moles of Na⁺ = 0.06 mol.\nTotal volume = 20.0 cm³ + 10.0 cm³ = 30.0 cm³ = 0.03 dm³.\nConcentration of Na⁺ = 0.06 mol / 0.03 dm³ = 2.0 M.' }
            ],
            // 15.2 化學反應中的濃度計算
            'acids_ch15_2': [
                { questionZh: '某金屬氯化物 XClₙ 的溶液與硝酸銀溶液作用時，生成氯化銀沉澱。若 20 cm³ 的 0.15 M 硝酸銀溶液需用 30 cm³ 的 0.05 M XClₙ 溶液與它完全作用，則這金屬氯化物的化學式是', questionEn: 'A solution of a metal chloride, XClₙ, forms a precipitate of silver chloride with silver nitrate solution. If 20 cm³ of 0.15 M silver nitrate solution react completely with 30 cm³ of 0.05 M XClₙ solution, the formula of the metal chloride is', optionsZh: ['XCl', 'XCl₂', 'XCl₃', 'XCl₄', 'XCl₅'], optionsEn: ['XCl', 'XCl₂', 'XCl₃', 'XCl₄', 'XCl₅'], answer: 1, explanationZh: 'Ag⁺ 的摩爾數 = 0.15 M × 0.020 dm³ = 0.003 mol。\n反應生成 AgCl 沉澱，所以需要的 Cl⁻ 摩爾數也是 0.003 mol。\nXClₙ 的摩爾數 = 0.05 M × 0.030 dm³ = 0.0015 mol。\n每摩爾 XClₙ 含有 n 摩爾 Cl⁻，因此 n = 0.003 mol / 0.0015 mol = 2。\n化學式為 XCl₂。', explanationEn: 'Moles of Ag⁺ = 0.15 M × 0.020 dm³ = 0.003 mol.\nThe reaction forms AgCl precipitate, so moles of Cl⁻ required is also 0.003 mol.\nMoles of XClₙ = 0.05 M × 0.030 dm³ = 0.0015 mol.\nEach mole of XClₙ contains n moles of Cl⁻, so n = 0.003 mol / 0.0015 mol = 2.\nThe formula is XCl₂.' },
                { questionZh: '25.00 cm³ 的某二元酸的溶液需要 30.00 cm³ 的 0.10 M 氫氧化鈉作完全中和。該酸的濃度是', questionEn: '25.00 cm³ of a solution of a dibasic acid required 30.00 cm³ of 0.10 M sodium hydroxide for complete neutralization. The concentration of the acid was', optionsZh: ['0.03 M', '0.06 M', '0.12 M', '0.24 M'], optionsEn: ['0.03 M', '0.06 M', '0.12 M', '0.24 M'], answer: 1, explanationZh: '二元酸 (設為 H₂A) 與 NaOH 的反應方程式：H₂A + 2NaOH → Na₂A + 2H₂O。\nNaOH 的摩爾數 = 0.10 M × 0.030 dm³ = 0.003 mol。\n根據反應比例，酸的摩爾數 = 0.003 mol / 2 = 0.0015 mol。\n酸的濃度 = 0.0015 mol / 0.025 dm³ = 0.06 M。', explanationEn: 'Reaction equation for dibasic acid (let it be H₂A) and NaOH: H₂A + 2NaOH → Na₂A + 2H₂O.\nMoles of NaOH = 0.10 M × 0.030 dm³ = 0.003 mol.\nAccording to the mole ratio, moles of acid = 0.003 mol / 2 = 0.0015 mol.\nConcentration of acid = 0.0015 mol / 0.025 dm³ = 0.06 M.' },
                { questionZh: '25 cm³ 的 0.2 M 酸的溶液需要 15 cm³ 的 0.5 M 碳酸鈉溶液作完全中和。該酸的鹽基度是多少？', questionEn: '25 cm³ of a 0.2 M solution of an acid requires 15 cm³ of 0.5 M sodium carbonate solution for complete neutralization. What is the basicity of the acid?', optionsZh: ['1', '2', '3', '4'], optionsEn: ['1', '2', '3', '4'], answer: 2, explanationZh: '中和反應中，H⁺ 與 CO₃²⁻ 的反應比例為 2:1 (2H⁺ + CO₃²⁻ → H₂O + CO₂)。\nCO₃²⁻ 的摩爾數 = 0.5 M × 0.015 dm³ = 0.0075 mol。\n所需的 H⁺ 摩爾數 = 2 × 0.0075 mol = 0.015 mol。\n酸的摩爾數 = 0.2 M × 0.025 dm³ = 0.005 mol。\n鹽基度 = H⁺ 摩爾數 / 酸的摩爾數 = 0.015 mol / 0.005 mol = 3。', explanationEn: 'In the neutralization reaction, the mole ratio of H⁺ to CO₃²⁻ is 2:1 (2H⁺ + CO₃²⁻ → H₂O + CO₂).\nMoles of CO₃²⁻ = 0.5 M × 0.015 dm³ = 0.0075 mol.\nMoles of H⁺ required = 2 × 0.0075 mol = 0.015 mol.\nMoles of acid = 0.2 M × 0.025 dm³ = 0.005 mol.\nBasicity = Moles of H⁺ / Moles of acid = 0.015 mol / 0.005 mol = 3.' },
                { questionZh: '將 22 g 碳酸鈣加入 200 cm³ 的 0.5 M 氫氯酸中，反應結束後，還餘下多少碳酸鈣？\n(相對原子質量：C = 12.0; O = 16.0; Ca = 40.0)', questionEn: '22 g of calcium carbonate are allowed to react with 200 cm³ of 0.5 M hydrochloric acid until no further reaction occurs. What is the mass of calcium carbonate left behind?\n(Relative atomic masses: C = 12.0; O = 16.0; Ca = 40.0)', optionsZh: ['2 g', '5 g', '12 g', '17 g'], optionsEn: ['2 g', '5 g', '12 g', '17 g'], answer: 3, explanationZh: '反應方程式：CaCO₃ + 2HCl → CaCl₂ + H₂O + CO₂。\nHCl 的摩爾數 = 0.5 M × 0.200 dm³ = 0.1 mol。\n根據反應比例，消耗的 CaCO₃ 摩爾數 = 0.1 mol / 2 = 0.05 mol。\nCaCO₃ 的摩爾質量 = 40.0 + 12.0 + 3(16.0) = 100.0 g/mol。\n消耗的 CaCO₃ 質量 = 0.05 mol × 100.0 g/mol = 5.0 g。\n餘下的 CaCO₃ 質量 = 22 g - 5.0 g = 17 g。', explanationEn: 'Reaction equation: CaCO₃ + 2HCl → CaCl₂ + H₂O + CO₂.\nMoles of HCl = 0.5 M × 0.200 dm³ = 0.1 mol.\nAccording to the mole ratio, moles of CaCO₃ reacted = 0.1 mol / 2 = 0.05 mol.\nMolar mass of CaCO₃ = 40.0 + 12.0 + 3(16.0) = 100.0 g/mol.\nMass of CaCO₃ reacted = 0.05 mol × 100.0 g/mol = 5.0 g.\nMass of CaCO₃ left = 22 g - 5.0 g = 17 g.' },
                { questionZh: '1.55 g 某水合碳酸鈉 Na₂CO₃·xH₂O 可與 25 cm³ 的 1 M 氫氯酸完全反應。x 的數值是多少？\n(相對原子質量：H = 1.0; C = 12.0; O = 16.0; Na = 23.0)', questionEn: '1.55 g of a hydrated sodium carbonate, Na₂CO₃·xH₂O, react completely with 25 cm³ of 1 M hydrochloric acid. What is the value of x?\n(Relative atomic masses: H = 1.0; C = 12.0; O = 16.0; Na = 23.0)', optionsZh: ['1', '2', '4', '10'], optionsEn: ['1', '2', '4', '10'], answer: 0, explanationZh: '反應方程式：Na₂CO₃ + 2HCl → 2NaCl + H₂O + CO₂。\nHCl 的摩爾數 = 1 M × 0.025 dm³ = 0.025 mol。\n根據反應比例，Na₂CO₃ 的摩爾數 = 0.025 mol / 2 = 0.0125 mol。\nNa₂CO₃·xH₂O 的摩爾質量 = 1.55 g / 0.0125 mol = 124 g/mol。\n無水 Na₂CO₃ 的摩爾質量 = 2(23.0) + 12.0 + 3(16.0) = 106.0 g/mol。\n水 (H₂O) 的摩爾質量 = 18.0 g/mol。\n106.0 + 18.0x = 124 → 18.0x = 18.0 → x = 1。', explanationEn: 'Reaction equation: Na₂CO₃ + 2HCl → 2NaCl + H₂O + CO₂.\nMoles of HCl = 1 M × 0.025 dm³ = 0.025 mol.\nAccording to the mole ratio, moles of Na₂CO₃ = 0.025 mol / 2 = 0.0125 mol.\nMolar mass of Na₂CO₃·xH₂O = 1.55 g / 0.0125 mol = 124 g/mol.\nMolar mass of anhydrous Na₂CO₃ = 2(23.0) + 12.0 + 3(16.0) = 106.0 g/mol.\nMolar mass of H₂O = 18.0 g/mol.\n106.0 + 18.0x = 124 → 18.0x = 18.0 → x = 1.' },
                { questionZh: '50 cm³ 的 0.6 M H₂SO₄ 在完全中和 100 cm³ 的 0.6 M NaOH 後，所生成硫酸鈉溶液的濃度是', questionEn: 'After 50 cm³ of 0.6 M H₂SO₄ have completely neutralized 100 cm³ of 0.6 M NaOH, the concentration of the resulting sodium sulphate solution is', optionsZh: ['0.2 M', '0.3 M', '0.6 M', '1.2 M'], optionsEn: ['0.2 M', '0.3 M', '0.6 M', '1.2 M'], answer: 0, explanationZh: '反應方程式：H₂SO₄ + 2NaOH → Na₂SO₄ + 2H₂O。\nH₂SO₄ 的摩爾數 = 0.6 M × 0.050 dm³ = 0.03 mol。\nNaOH 的摩爾數 = 0.6 M × 0.100 dm³ = 0.06 mol。\n兩者剛好完全反應，生成 0.03 mol 的 Na₂SO₄。\n總體積 = 50 cm³ + 100 cm³ = 150 cm³ = 0.15 dm³。\nNa₂SO₄ 濃度 = 0.03 mol / 0.15 dm³ = 0.2 M。', explanationEn: 'Reaction equation: H₂SO₄ + 2NaOH → Na₂SO₄ + 2H₂O.\nMoles of H₂SO₄ = 0.6 M × 0.050 dm³ = 0.03 mol.\nMoles of NaOH = 0.6 M × 0.100 dm³ = 0.06 mol.\nThey react completely to form 0.03 mol of Na₂SO₄.\nTotal volume = 50 cm³ + 100 cm³ = 150 cm³ = 0.15 dm³.\nConcentration of Na₂SO₄ = 0.03 mol / 0.15 dm³ = 0.2 M.' },
                { questionZh: '把 0.12 g 鈉金屬加入大量水中。反應完畢，若要把所得的溶液完全中和，須加入 0.2 M 氫氯酸多少 cm³？(下列答案只為近似整數值。)\n(相對原子質量：Na = 23.0)', questionEn: '0.12 g of sodium metal is added to a large volume of water. When the reaction is completed, the resulting solution is treated with 0.2 M hydrochloric acid. What is the volume of the acid required, to the nearest cm³, for complete neutralization?\n(Relative atomic masses: Na = 23.0)', optionsZh: ['13', '26', '39', '52'], optionsEn: ['13', '26', '39', '52'], answer: 1, explanationZh: '鈉與水的反應：2Na + 2H₂O → 2NaOH + H₂。\nNa 的摩爾數 = 0.12 g / 23.0 g/mol ≈ 0.005217 mol。\n生成的 NaOH 摩爾數 = 0.005217 mol。\n中和反應：NaOH + HCl → NaCl + H₂O。\n所需的 HCl 摩爾數 = 0.005217 mol。\nHCl 體積 = 摩爾數 / 濃度 = 0.005217 mol / 0.2 M ≈ 0.02608 dm³ = 26.08 cm³ ≈ 26 cm³。', explanationEn: 'Reaction of sodium with water: 2Na + 2H₂O → 2NaOH + H₂.\nMoles of Na = 0.12 g / 23.0 g/mol ≈ 0.005217 mol.\nMoles of NaOH formed = 0.005217 mol.\nNeutralization reaction: NaOH + HCl → NaCl + H₂O.\nMoles of HCl required = 0.005217 mol.\nVolume of HCl = Moles / Concentration = 0.005217 mol / 0.2 M ≈ 0.02608 dm³ = 26.08 cm³ ≈ 26 cm³.' },
                { questionZh: '某金屬碳酸鹽的化學式是 X₂CO₃。要與含 0.69 g 的該碳酸鹽的 100 cm³ 溶液完全反應，需用 50 cm³ 的 0.20 M 氫氯酸。金屬 X 的相對原子質量是多少？\n(相對原子質量：C = 12.0, O = 16.0)', questionEn: 'The formula of a metal carbonate is X₂CO₃. 100 cm³ of a solution containing 0.69 g of the carbonate requires 50 cm³ of 0.20 M hydrochloric acid for complete reaction. What is the relative atomic mass of metal X?\n(Relative atomic masses: C = 12.0, O = 16.0)', optionsZh: ['19.0', '23.0', '39.0', '78.0'], optionsEn: ['19.0', '23.0', '39.0', '78.0'], answer: 2, explanationZh: '反應方程式：X₂CO₃ + 2HCl → 2XCl + H₂O + CO₂。\nHCl 的摩爾數 = 0.20 M × 0.050 dm³ = 0.01 mol。\n根據反應比例，X₂CO₃ 的摩爾數 = 0.01 mol / 2 = 0.005 mol。\nX₂CO₃ 的摩爾質量 = 0.69 g / 0.005 mol = 138 g/mol。\n2X + 12.0 + 3(16.0) = 138 → 2X + 60.0 = 138 → 2X = 78.0 → X = 39.0。', explanationEn: 'Reaction equation: X₂CO₃ + 2HCl → 2XCl + H₂O + CO₂.\nMoles of HCl = 0.20 M × 0.050 dm³ = 0.01 mol.\nAccording to the mole ratio, moles of X₂CO₃ = 0.01 mol / 2 = 0.005 mol.\nMolar mass of X₂CO₃ = 0.69 g / 0.005 mol = 138 g/mol.\n2X + 12.0 + 3(16.0) = 138 → 2X + 60.0 = 138 → 2X = 78.0 → X = 39.0.' },
                { questionZh: '某酸的水溶液的濃度是 1.0 M。要完全中和 25.0 cm³ 的這酸溶液，需用 37.5 cm³ 的 2.0 M 氫氧化鈉溶液。該酸的鹽基度是多少？', questionEn: 'The concentration of an aqueous solution of an acid is 1.0 M. 25.0 cm³ of this acid solution requires 37.5 cm³ of 2.0 M sodium hydroxide solution for complete neutralization. What is the basicity of the acid?', optionsZh: ['1', '2', '3', '4'], optionsEn: ['1', '2', '3', '4'], answer: 2, explanationZh: 'NaOH 的摩爾數 = 2.0 M × 0.0375 dm³ = 0.075 mol。\n酸的摩爾數 = 1.0 M × 0.025 dm³ = 0.025 mol。\n鹽基度 = 消耗的 OH⁻ 摩爾數 / 酸的摩爾數 = 0.075 mol / 0.025 mol = 3。', explanationEn: 'Moles of NaOH = 2.0 M × 0.0375 dm³ = 0.075 mol.\nMoles of acid = 1.0 M × 0.025 dm³ = 0.025 mol.\nBasicity = Moles of OH⁻ consumed / Moles of acid = 0.075 mol / 0.025 mol = 3.' },
                { questionZh: '在某實驗裏，把 1.00 M 氫氧化鈉溶液加入 25.0 cm³ 的 1.00 M 硫酸直至硫酸完全被中和。在所得溶液中，硫酸鈉的濃度(準確至兩位小數)是多少？', questionEn: 'In an experiment, 1.00 M sodium hydroxide solution was added to 25.0 cm³ of 1.00 M sulphuric acid until the acid was completely neutralized. What is the concentration of sodium sulphate (correct to two decimal places) in the resulting solution?', optionsZh: ['1.00 M', '0.50 M', '0.33 M', '0.25 M'], optionsEn: ['1.00 M', '0.50 M', '0.33 M', '0.25 M'], answer: 2, explanationZh: '反應方程式：H₂SO₄ + 2NaOH → Na₂SO₄ + 2H₂O。\nH₂SO₄ 的摩爾數 = 1.00 M × 0.025 dm³ = 0.025 mol。\n所需的 NaOH 摩爾數 = 2 × 0.025 mol = 0.050 mol。\n加入的 NaOH 體積 = 0.050 mol / 1.00 M = 0.050 dm³ = 50.0 cm³。\n總體積 = 25.0 cm³ + 50.0 cm³ = 75.0 cm³ = 0.075 dm³。\n生成的 Na₂SO₄ 摩爾數 = 0.025 mol。\nNa₂SO₄ 濃度 = 0.025 mol / 0.075 dm³ = 1/3 M ≈ 0.33 M。', explanationEn: 'Reaction equation: H₂SO₄ + 2NaOH → Na₂SO₄ + 2H₂O.\nMoles of H₂SO₄ = 1.00 M × 0.025 dm³ = 0.025 mol.\nMoles of NaOH required = 2 × 0.025 mol = 0.050 mol.\nVolume of NaOH added = 0.050 mol / 1.00 M = 0.050 dm³ = 50.0 cm³.\nTotal volume = 25.0 cm³ + 50.0 cm³ = 75.0 cm³ = 0.075 dm³.\nMoles of Na₂SO₄ formed = 0.025 mol.\nConcentration of Na₂SO₄ = 0.025 mol / 0.075 dm³ = 1/3 M ≈ 0.33 M.' },
                { questionZh: '要完全中和 20.0 cm³ 的 2.0 M 氨水，需用 16.0 cm³ 硫酸。該硫酸的濃度是多少？\n(相對原子質量：H = 1.0, O = 16.0, S = 32.1)', questionEn: '20.0 cm³ of 2.0 M aqueous ammonia required 16.0 cm³ of sulphuric acid for complete neutralisation. What is the concentration of the sulphuric acid?\n(Relative atomic masses: H = 1.0, O = 16.0, S = 32.1)', optionsZh: ['61.3 g dm⁻³', '122.6 g dm⁻³', '183.9 g dm⁻³', '245.2 g dm⁻³'], optionsEn: ['61.3 g dm⁻³', '122.6 g dm⁻³', '183.9 g dm⁻³', '245.2 g dm⁻³'], answer: 1, explanationZh: '反應方程式：2NH₃ + H₂SO₄ → (NH₄)₂SO₄。\nNH₃ 的摩爾數 = 2.0 M × 0.020 dm³ = 0.04 mol。\n所需的 H₂SO₄ 摩爾數 = 0.04 mol / 2 = 0.02 mol。\nH₂SO₄ 的摩爾濃度 = 0.02 mol / 0.016 dm³ = 1.25 M。\nH₂SO₄ 的摩爾質量 = 2(1.0) + 32.1 + 4(16.0) = 98.1 g/mol。\n以 g dm⁻³ 表示的濃度 = 1.25 mol/dm³ × 98.1 g/mol = 122.625 g dm⁻³。', explanationEn: 'Reaction equation: 2NH₃ + H₂SO₄ → (NH₄)₂SO₄.\nMoles of NH₃ = 2.0 M × 0.020 dm³ = 0.04 mol.\nMoles of H₂SO₄ required = 0.04 mol / 2 = 0.02 mol.\nMolarity of H₂SO₄ = 0.02 mol / 0.016 dm³ = 1.25 M.\nMolar mass of H₂SO₄ = 2(1.0) + 32.1 + 4(16.0) = 98.1 g/mol.\nConcentration in g dm⁻³ = 1.25 mol/dm³ × 98.1 g/mol = 122.625 g dm⁻³.' },
                { questionZh: '草酸是一個二元酸。要完全中和 10.0 cm³ 的某草酸水溶液，需用 30.0 cm³ 的 0.10 M KOH(aq)。該草酸溶液的濃度是多少？', questionEn: 'Oxalic acid is a dibasic acid. 10.0 cm³ of an aqueous solution of oxalic acid requires 30.0 cm³ of 0.10 M KOH(aq) for complete neutralization. What is the concentration of the oxalic acid solution?', optionsZh: ['0.15 M', '0.20 M', '0.30 M', '0.60 M'], optionsEn: ['0.15 M', '0.20 M', '0.30 M', '0.60 M'], answer: 0, explanationZh: '設草酸為 H₂A，反應方程式：H₂A + 2KOH → K₂A + 2H₂O。\nKOH 的摩爾數 = 0.10 M × 0.030 dm³ = 0.003 mol。\n草酸的摩爾數 = 0.003 mol / 2 = 0.0015 mol。\n草酸溶液的濃度 = 0.0015 mol / 0.010 dm³ = 0.15 M。', explanationEn: 'Let oxalic acid be H₂A, reaction equation: H₂A + 2KOH → K₂A + 2H₂O.\nMoles of KOH = 0.10 M × 0.030 dm³ = 0.003 mol.\nMoles of oxalic acid = 0.003 mol / 2 = 0.0015 mol.\nConcentration of oxalic acid solution = 0.0015 mol / 0.010 dm³ = 0.15 M.' },
                { questionZh: '要完全中和 1.49 g 的氧化鋰，需用 0.5 M 氫氯酸的體積是多少？\n(相對原子質量：Li = 6.9, O = 16.0)', questionEn: 'What is the volume of 0.5 M hydrochloric acid required to react with 1.49 g of lithium oxide for complete neutralization?\n(Relative atomic masses: Li = 6.9, O = 16.0)', optionsZh: ['50 cm³', '100 cm³', '200 cm³', '260 cm³'], optionsEn: ['50 cm³', '100 cm³', '200 cm³', '260 cm³'], answer: 2, explanationZh: '反應方程式：Li₂O + 2HCl → 2LiCl + H₂O。\nLi₂O 的摩爾質量 = 2(6.9) + 16.0 = 29.8 g/mol。\nLi₂O 的摩爾數 = 1.49 g / 29.8 g/mol = 0.05 mol。\n所需的 HCl 摩爾數 = 2 × 0.05 mol = 0.1 mol。\nHCl 的體積 = 0.1 mol / 0.5 M = 0.2 dm³ = 200 cm³。', explanationEn: 'Reaction equation: Li₂O + 2HCl → 2LiCl + H₂O.\nMolar mass of Li₂O = 2(6.9) + 16.0 = 29.8 g/mol.\nMoles of Li₂O = 1.49 g / 29.8 g/mol = 0.05 mol.\nMoles of HCl required = 2 × 0.05 mol = 0.1 mol.\nVolume of HCl = 0.1 mol / 0.5 M = 0.2 dm³ = 200 cm³.' },
                { questionZh: '30.0 cm³ 的 0.10 M KOH 被 20.0 cm³ 的稀 H₂SO₄ 完全中和以生成 K₂SO₄ 溶液。所得鹽溶液的摩爾濃度是多少？', questionEn: '30.0 cm³ of 0.10 M KOH is completely neutralised by 20.0 cm³ of dilute H₂SO₄ to form K₂SO₄ solution. What is the molarity of the salt solution obtained?', optionsZh: ['0.03 M', '0.05 M', '0.06 M', '0.10 M'], optionsEn: ['0.03 M', '0.05 M', '0.06 M', '0.10 M'], answer: 0, explanationZh: '反應方程式：2KOH + H₂SO₄ → K₂SO₄ + 2H₂O。\nKOH 的摩爾數 = 0.10 M × 0.030 dm³ = 0.003 mol。\n生成的 K₂SO₄ 摩爾數 = 0.003 mol / 2 = 0.0015 mol。\n總體積 = 30.0 cm³ + 20.0 cm³ = 50.0 cm³ = 0.050 dm³。\nK₂SO₄ 的摩爾濃度 = 0.0015 mol / 0.050 dm³ = 0.03 M。', explanationEn: 'Reaction equation: 2KOH + H₂SO₄ → K₂SO₄ + 2H₂O.\nMoles of KOH = 0.10 M × 0.030 dm³ = 0.003 mol.\nMoles of K₂SO₄ formed = 0.003 mol / 2 = 0.0015 mol.\nTotal volume = 30.0 cm³ + 20.0 cm³ = 50.0 cm³ = 0.050 dm³.\nMolarity of K₂SO₄ = 0.0015 mol / 0.050 dm³ = 0.03 M.' },
                { questionZh: 'X 是一個酸。25.0 cm³ 的 0.20 M X 溶液需要 30.0 cm³ 的 0.50 M 氫氧化鈉溶液來達致完全中和。X 的鹽基度是多少？', questionEn: 'X is an acid. 25.0 cm³ of 0.20 M solution X requires 30.0 cm³ of 0.50 M sodium hydroxide solution for complete neutralisation. What is the basicity of X?', optionsZh: ['1', '2', '3', '4'], optionsEn: ['1', '2', '3', '4'], answer: 2, explanationZh: 'NaOH 的摩爾數 = 0.50 M × 0.030 dm³ = 0.015 mol。\nX 的摩爾數 = 0.20 M × 0.025 dm³ = 0.005 mol。\n鹽基度 = 消耗的 OH⁻ 摩爾數 / 酸的摩爾數 = 0.015 mol / 0.005 mol = 3。', explanationEn: 'Moles of NaOH = 0.50 M × 0.030 dm³ = 0.015 mol.\nMoles of X = 0.20 M × 0.025 dm³ = 0.005 mol.\nBasicity = Moles of OH⁻ consumed / Moles of acid = 0.015 mol / 0.005 mol = 3.' },
                { questionZh: '固態酸 T 的相對分子質量是 192.0。一個 0.80 g 的 T 樣本溶於水所生成的溶液需要 25.00 cm³ 的 0.50 M 氫氧化鈉溶液完全中和。T 的鹽基度是多少？', questionEn: 'Solid acid T has a relative molecular mass of 192.0. A sample of 0.80 g of T is dissolved in water to form a solution which requires 25.0 cm³ of 0.50 M sodium hydroxide solution for complete neutralisation. What is the basicity of T?', optionsZh: ['1', '2', '3', '4'], optionsEn: ['1', '2', '3', '4'], answer: 2, explanationZh: 'T 的摩爾數 = 0.80 g / 192.0 g/mol ≈ 0.004167 mol。\nNaOH 的摩爾數 = 0.50 M × 0.025 dm³ = 0.0125 mol。\n鹽基度 = 消耗的 OH⁻ 摩爾數 / T 的摩爾數 = 0.0125 mol / 0.004167 mol = 3。', explanationEn: 'Moles of T = 0.80 g / 192.0 g/mol ≈ 0.004167 mol.\nMoles of NaOH = 0.50 M × 0.025 dm³ = 0.0125 mol.\nBasicity = Moles of OH⁻ consumed / Moles of T = 0.0125 mol / 0.004167 mol = 3.' }
            ],
            // 16.1 pH標度用以量度溶液的酸度和鹼度
            'acids_ch16_1': [
                { questionZh: '水的導電性低，因為', questionEn: 'Water has low electric conductivity because', optionsZh: ['它是一電價化合物。', '它完全以分子形式存在。', '它的分子僅輕微電離。', '有相同數目的H⁺和OH⁻離子。', '每個水分子具有兩個孤電子對。'], optionsEn: ['it is an electrovalent compound.', 'it exists entirely as molecules.', 'its molecules are only slightly ionized.', 'there are equal number of H⁺ and OH⁻ ions.', 'each water molecule has two lone pairs of electrons.'], answer: 2, explanationZh: '水是共價分子，只有極少部分的水分子會發生自偶電離產生H+和OH-，因此導電性很低。', explanationEn: 'Water is a covalent molecule that only slightly ionizes into H+ and OH- ions, resulting in very low electrical conductivity.' },
                { questionZh: '下列哪個溶液具有最低的pH值？', questionEn: 'Which of the following solutions would have the lowest pH value?', optionsZh: ['0.1 M H₂SO₄', '0.1 M HCl', '0.1 M CH₃COOH', '0.1 M NaOH', '0.1 M 氨溶液'], optionsEn: ['0.1 M H₂SO₄', '0.1 M HCl', '0.1 M CH₃COOH', '0.1 M NaOH', '0.1 M ammonia solution'], answer: 0, explanationZh: 'H2SO4是強二元酸，完全電離出兩倍的H+，因此H+濃度最高，pH值最低。', explanationEn: 'H2SO4 is a strong dibasic acid, producing twice the concentration of H+ upon complete ionization, giving it the lowest pH.' },
                { questionZh: '下列哪些溶液的pH值小於7？\n(1) 醋\n(2) 「七喜」汽水\n(3) 肥皂溶液\n(4) 石灰水', questionEn: 'Which of the following solutions would have a pH value of less than 7?\n(1) vinegar\n(2) \'7-up\' soft drink\n(3) soap solution\n(4) limewater', optionsZh: ['只有 (1) 和 (2)', '只有 (1) 和 (3)', '只有 (2) 和 (3)', '只有 (2) 和 (4)', '只有 (3) 和 (4)'], optionsEn: ['(1) and (2) only', '(1) and (3) only', '(2) and (3) only', '(2) and (4) only', '(3) and (4) only'], answer: 0, explanationZh: '醋（含乙酸）和汽水（含碳酸）呈酸性，pH小於7。肥皂溶液和石灰水呈鹼性。', explanationEn: 'Vinegar (contains ethanoic acid) and soft drinks (contain carbonic acid) are acidic with pH < 7. Soap and limewater are alkaline.' },
                { questionZh: '純水的導電性低，因為', questionEn: 'Pure water has a low electrical conductivity because', optionsZh: ['它僅以分子形式存在。', '它需要長時間去建立平衡 H₂O(l) ⇌ H⁺(aq) + OH⁻(aq)。', '它含有相同數目的H⁺(aq)和OH⁻(aq)。', '它僅輕微電離。'], optionsEn: ['it exists as molecules only.', 'it takes a long time to establish the equilibrium H₂O(l) ⇌ H⁺(aq) + OH⁻(aq).', 'it contains equal numbers of H⁺(aq) and OH⁻(aq).', 'it is only slightly ionized.'], answer: 3, explanationZh: '純水中只有極少數水分子電離成離子，缺乏足夠的流動離子來導電。', explanationEn: 'Only a very small fraction of water molecules ionize into ions, resulting in a lack of mobile ions to conduct electricity well.' },
                { questionZh: '下列何者在加進10 cm³的0.1 M氫氧化鈉溶液時，會改變氫氧化鈉溶液的pH值？\n(1) 10 cm³的0.1 M氯化鈉溶液\n(2) 5 cm³的0.1 M氫氧化鉀溶液\n(3) 10 cm³的蒸餾水', questionEn: 'Which of the following, when added to 10 cm³ of 0.1 M sodium hydroxide solution, would change the pH value of the sodium hydroxide solution?\n(1) 10 cm³ of 0.1 M sodium chloride solution\n(2) 5 cm³ of 0.1 M potassium hydroxide solution\n(3) 10 cm³ of distilled water', optionsZh: ['只有 (1) 和 (2)', '只有 (1) 和 (3)', '只有 (2) 和 (3)', '(1)、(2) 和 (3)'], optionsEn: ['(1) and (2) only', '(1) and (3) only', '(2) and (3) only', '(1), (2) and (3)'], answer: 1, explanationZh: '加入氯化鈉溶液或蒸餾水都會稀釋原有的NaOH溶液，降低OH-濃度，從而改變pH。加入同濃度的強鹼(KOH)不會改變總OH-濃度。', explanationEn: 'Adding NaCl solution or distilled water dilutes the NaOH, changing the OH- concentration and pH. Adding KOH of the same concentration keeps the OH- concentration constant.' },
                { questionZh: '某乙酸水溶液的pH值為4。若要將這溶液的pH值提高，應加入下列哪些物質？\n(1) 固態碳酸鈣\n(2) 固態氯化鈉\n(3) 氨水\n(4) 稀硫酸', questionEn: 'An aqueous solution of ethanoic acid has a pH value of 4. Which of the following substances, when added to this solution, would increase its pH value?\n(1) solid calcium carbonate\n(2) solid sodium chloride\n(3) aqueous ammonia\n(4) dilute sulphuric acid', optionsZh: ['只有 (1) 和 (3)', '只有 (1) 和 (4)', '只有 (2) 和 (3)', '只有 (2) 和 (4)'], optionsEn: ['(1) and (3) only', '(1) and (4) only', '(2) and (3) only', '(2) and (4) only'], answer: 0, explanationZh: '提高pH值意味著降低酸性/增加鹼性。碳酸鈣會與酸反應消耗H+；氨水是鹼會中和酸，兩者皆可提高pH。', explanationEn: 'Increasing pH means decreasing acidity. Calcium carbonate reacts with the acid, and ammonia neutralizes it, both reducing H+ concentration and raising pH.' },
                { questionZh: '第一敘述句：蒸餾水是一種不良的導電體。\n第二敘述句：蒸餾水含有相同數目的H⁺(aq)和OH⁻(aq)離子。', questionEn: '1st statement: Distilled water is a poor conductor of electricity.\n2nd statement: Distilled water contains an equal number of H⁺(aq) ions and OH⁻(aq) ions.', optionsZh: ['兩敘述句均屬正確，而第二敘述句為第一敘述句的合理解釋。', '兩敘述句均屬正確，但第二敘述句並非第一敘述句的合理解釋。', '只有一敘述句正確，而另一敘述句是錯誤的。', '兩敘述句均屬錯誤。'], optionsEn: ['Both statements are true and the 2nd statement is a correct explanation of the 1st statement.', 'Both statements are true but the 2nd statement is NOT a correct explanation of the 1st statement.', 'Only one statement is true while the other is false.', 'Both statements are false.'], answer: 1, explanationZh: '兩句皆對。但水是不良導體是因為離子「數量極少」，而不是因為正負離子「數目相同」。', explanationEn: 'Both are true. However, water is a poor conductor because the "total number" of ions is very low, not because the numbers of H+ and OH- are "equal".' },
                { questionZh: '下列哪種物質的pH值小於7？', questionEn: 'Which of the following substances has a pH less than 7?', optionsZh: ['檸檬汁', '肥皂溶液', '玻璃清潔劑', '氧化鎂乳劑'], optionsEn: ['lemon juice', 'soap solution', 'glass cleaner', 'milk of magnesia'], answer: 0, explanationZh: '檸檬汁含檸檬酸，呈酸性，pH小於7。', explanationEn: 'Lemon juice contains citric acid and is acidic (pH < 7).' },
                { questionZh: '有水溶液如下：\n(1) 1 M 乙酸\n(2) 1 M 氫氯酸\n(3) 1 M 氨溶液\n下列哪項排列顯示上述水溶液的pH值循序遞增？', questionEn: 'Consider the aqueous solutions listed below:\n(1) 1 M ethanoic acid\n(2) 1 M hydrochloric acid\n(3) 1 M ammonia solution\nWhich of the following represents the increasing order of pH of the solutions?', optionsZh: ['(1), (2), (3)', '(2), (1), (3)', '(3), (1), (2)', '(3), (2), (1)'], optionsEn: ['(1), (2), (3)', '(2), (1), (3)', '(3), (1), (2)', '(3), (2), (1)'], answer: 1, explanationZh: '氫氯酸是強酸(pH最低)，乙酸是弱酸(pH較高)，氨水是鹼(pH最高)。順序：(2) < (1) < (3)。', explanationEn: 'HCl is a strong acid (lowest pH), ethanoic acid is a weak acid, and ammonia is an alkali (highest pH). Order: (2) < (1) < (3).' },
                { questionZh: '下列物質溶於水時，何者會生成pH值大於7的溶液？\n(1) 氯\n(2) 氧化鈣\n(3) 二氧化硫', questionEn: 'Which of the following substances, when dissolved in water, gives a solution with pH greater than 7?\n(1) chlorine\n(2) calcium oxide\n(3) sulphur dioxide', optionsZh: ['只有 (1)', '只有 (2)', '只有 (1) 和 (3)', '只有 (2) 和 (3)'], optionsEn: ['(1) only', '(2) only', '(1) and (3) only', '(2) and (3) only'], answer: 1, explanationZh: '氧化鈣溶於水生成氫氧化鈣(強鹼，pH>7)。氯和二氧化硫溶於水皆生成酸性溶液。', explanationEn: 'Calcium oxide dissolves in water to form calcium hydroxide (alkaline, pH > 7). Chlorine and sulphur dioxide form acidic solutions.' },
                { questionZh: '以下哪項有關KOH(aq)的陳述正確？', questionEn: 'Which of the following statements concerning KOH(aq) is correct?', optionsZh: ['KOH(aq)與稀氫氯酸的反應是放熱的。', 'KOH(aq)內氫離子較氫氧離子為多。', '把水加進KOH(aq)可增加其pH。', 'KOH(aq)不能導電。'], optionsEn: ['The reaction between KOH(aq) and dilute hydrochloric acid is exothermic.', 'There are more hydrogen ions than hydroxide ions in KOH(aq).', 'Adding water to KOH(aq) can increase its pH.', 'KOH(aq) cannot conduct electricity.'], answer: 0, explanationZh: '酸鹼中和反應是放熱反應。', explanationEn: 'Acid-base neutralization reactions are exothermic.' },
                { questionZh: '下列哪些有關氨水的陳述正確？\n(1) 它的 pH 大於 7。\n(2) 它不含任何氫離子。\n(3) 它與硝酸鎂溶液反應，生成白色沉澱。', questionEn: 'Which of the following statements about ammonia solution is/are correct?\n(1) Its pH is greater than 7.\n(2) It does not contain any hydrogen ions.\n(3) It reacts with magnesium nitrate solution to form a white precipitate.', optionsZh: ['只有(1)和(2)', '只有(1)和(3)', '只有(2)和(3)', '(1)、(2)和(3)'], optionsEn: ['(1) and (2) only', '(1) and (3) only', '(2) and (3) only', '(1), (2) and (3)'], answer: 1, explanationZh: '氨水是鹼，pH大於7，且能與鎂離子生成氫氧化鎂白沉澱。所有水溶液都含有氫離子（即使是鹼性溶液，只是濃度很低），故(2)錯。', explanationEn: 'Ammonia is alkaline (pH > 7) and forms a white precipitate with Mg. All aqueous solutions contain some hydrogen ions, so (2) is false.' },
                { questionZh: '下列哪個溶液的 pH 最高？', questionEn: 'Which of the following solutions has the highest pH?', optionsZh: ['1.0 M HCl(aq)', '1.0 M H₂SO₄(aq)', '1.0 M NaCl(aq)', '1.0 M NaOH(aq)'], optionsEn: ['1.0 M HCl(aq)', '1.0 M H₂SO₄(aq)', '1.0 M NaCl(aq)', '1.0 M NaOH(aq)'], answer: 3, explanationZh: 'NaOH是強鹼，具有最高的pH值。', explanationEn: 'NaOH is a strong alkali and has the highest pH among the choices.' },
                { questionZh: '一摩爾的下列各物質分別溶於水中，以製備 1 dm³ 的溶液。哪個所製備的溶液的 pH 最高？', questionEn: 'One mole of each of the following substances is dissolved in water to prepare 1 dm³ of solution. Which solution prepared has the highest pH?', optionsZh: ['二氧化碳', '氯化氫', '氯化鈉', '氫氧化鈉'], optionsEn: ['Carbon dioxide', 'Hydrogen chloride', 'Sodium chloride', 'Sodium hydroxide'], answer: 3, explanationZh: '氫氧化鈉是強鹼，pH最高。', explanationEn: 'Sodium hydroxide is a strong alkali and yields the highest pH.' },
                { questionZh: '把某氣體樣本通入蒸餾水，溶液的 pH 慢慢上升。該樣本可能是下列哪個氣體？', questionEn: 'A gas sample is passed into distilled water, and the pH of the solution slowly rises. Which of the following gases could the sample be?', optionsZh: ['一氧化碳', '氮', '氨', '二氧化碳'], optionsEn: ['Carbon monoxide', 'Nitrogen', 'Ammonia', 'Carbon dioxide'], answer: 2, explanationZh: 'pH上升代表溶液變鹼。氨氣溶於水生成弱鹼性的氨水。', explanationEn: 'An increase in pH means the solution becomes alkaline. Ammonia dissolves in water to form an alkaline solution.' },
                { questionZh: '下列哪項有關中性溶液的陳述正確？', questionEn: 'Which of the following statements about a neutral solution is correct?', optionsZh: ['H⁺(aq)離子的濃度較 OH⁻(aq)離子的濃度高。', 'H⁺(aq)離子的濃度與 OH⁻(aq)離子的濃度相等。', 'H⁺(aq)離子的濃度較 OH⁻(aq)離子的濃度低。', '溶液中不含 H⁺(aq)離子或 OH⁻(aq)離子。'], optionsEn: ['The concentration of H⁺(aq) ions is higher than that of OH⁻(aq) ions.', 'The concentration of H⁺(aq) ions is equal to that of OH⁻(aq) ions.', 'The concentration of H⁺(aq) ions is lower than that of OH⁻(aq) ions.', 'The solution does not contain H⁺(aq) ions or OH⁻(aq) ions.'], answer: 1, explanationZh: '中性溶液的定義是氫離子濃度等於氫氧離子濃度。', explanationEn: 'A neutral solution is defined as having equal concentrations of hydrogen and hydroxide ions.' },
                { questionZh: '把下列各組中的第二個反應物加入第一個溶液，哪組中第一個溶液的 pH 會上升？', questionEn: 'When the second reactant in each of the following pairs is added to the first solution, in which pair will the pH of the first solution increase?', optionsZh: ['氫氯酸 + 鎂', '氫氧化鈉溶液 + 硫酸', '氨水 + 硫酸鎂溶液', '蒸餾水 + 氫氯酸'], optionsEn: ['Hydrochloric acid + Magnesium', 'Sodium hydroxide solution + Sulphuric acid', 'Ammonia solution + Magnesium sulphate solution', 'Distilled water + Hydrochloric acid'], answer: 0, explanationZh: '鎂會與氫氯酸反應消耗H+，使酸性減弱，pH上升。', explanationEn: 'Magnesium reacts with HCl, consuming H+ ions and reducing acidity, which increases the pH.' },
                { questionZh: '把下列哪個或哪些物質加入石灰水會使石灰水的 pH 下降？\n(1) 二氧化碳\n(2) 碳酸鈣\n(3) 氯化鈉溶液', questionEn: 'Adding which of the following substances to limewater will decrease the pH of the limewater?\n(1) Carbon dioxide\n(2) Calcium carbonate\n(3) Sodium chloride solution', optionsZh: ['只有(1)', '只有(2)', '只有(1)和(3)', '只有(2)和(3)'], optionsEn: ['(1) only', '(2) only', '(1) and (3) only', '(2) and (3) only'], answer: 2, explanationZh: '二氧化碳會中和石灰水（鹼），使其pH下降。加入中性的氯化鈉溶液會稀釋石灰水，也會使其pH下降。', explanationEn: 'CO2 neutralizes the alkaline limewater, lowering pH. Adding neutral NaCl solution dilutes the alkali, also lowering pH.' },
                { questionZh: '若不斷把蒸餾水加入某橙汁樣本，下列哪項或哪些陳述正確？\n(1) 這過程涉及物理變化。\n(2) 樣本中氫離子的濃度增加。\n(3) 樣本的 pH 不斷上升。', questionEn: 'If distilled water is continuously added to an orange juice sample, which of the following statements is/are correct?\n(1) This process involves a physical change.\n(2) The concentration of hydrogen ions in the sample increases.\n(3) The pH of the sample continuously increases.', optionsZh: ['只有(1)', '只有(2)', '只有(1)和(3)', '只有(2)和(3)'], optionsEn: ['(1) only', '(2) only', '(1) and (3) only', '(2) and (3) only'], answer: 2, explanationZh: '加水稀釋是物理變化。稀釋酸性橙汁會使氫離子濃度下降，pH值逐漸上升（趨近於7）。', explanationEn: 'Dilution is a physical change. Diluting acidic orange juice decreases H+ concentration, causing the pH to rise towards 7.' },
                { questionZh: '在 25°C，50 cm³ 的 0.01 M 強酸 HnA 的 pH 是 2。下列哪項陳述正確？', questionEn: 'At 25°C, the pH of 50 cm³ of 0.01 M strong acid HnA is 2. Which of the following statements is correct?', optionsZh: ['n 的值是 2。', '在 25°C，100 cm³ 的 0.01 M HnA 的 pH 是 1。', '把 25 cm³ 的 0.01 M H₂SO₄(aq)加入溶液會使溶液的 pH 下降。', '把 25 cm³ 的 0.01 M NaOH(aq)加入溶液會使溶液的 pH 上升至 7。'], optionsEn: ['The value of n is 2.', 'At 25°C, the pH of 100 cm³ of 0.01 M HnA is 1.', 'Adding 25 cm³ of 0.01 M H₂SO₄(aq) to the solution will decrease its pH.', 'Adding 25 cm³ of 0.01 M NaOH(aq) to the solution will increase its pH to 7.'], answer: 2, explanationZh: 'pH=2表示[H+]=0.01M，與酸濃度相同，故n=1。加入0.01M H2SO4(產生0.02M H+)會增加整體[H+]，使pH下降。', explanationEn: 'pH 2 means [H+]=0.01M, same as acid conc., so n=1. Adding 0.01M H2SO4 (which gives 0.02M H+) increases overall [H+], lowering pH.' },
                { questionZh: '考慮四個水溶液的 pH。\n溶液 P: pH 1\n溶液 Q: pH 3\n溶液 R: pH 8\n溶液 S: pH 9\n下列哪對溶液混合時必定得出鹼性的混合物？', questionEn: 'Consider the pH of four aqueous solutions.\nSolution P: pH 1\nSolution Q: pH 3\nSolution R: pH 8\nSolution S: pH 9\nWhich of the following pairs of solutions, when mixed, will definitely result in an alkaline mixture?', optionsZh: ['P 和 Q', 'Q 和 R', 'R 和 S', 'P 和 S'], optionsEn: ['P and Q', 'Q and R', 'R and S', 'P and S'], answer: 2, explanationZh: 'R和S都是鹼性溶液，混合後必定仍是鹼性。', explanationEn: 'Both R and S are alkaline solutions, so their mixture will definitely remain alkaline.' },
                { questionZh: '考慮四個溶液 P、Q、R 和 S：\nP：0.05 M HCl(aq)\nQ：0.05 M H₂SO₄(aq)\nR：0.05 M KCl(aq)\nS：0.05 M NH₃(aq)\n下列哪項顯示溶液 pH 遞增的次序？', questionEn: 'Consider four solutions P, Q, R and S:\nP: 0.05 M HCl(aq)\nQ: 0.05 M H₂SO₄(aq)\nR: 0.05 M KCl(aq)\nS: 0.05 M NH₃(aq)\nWhich of the following shows the increasing order of pH of the solutions?', optionsZh: ['P、S、R、Q', 'Q、R、S、P', 'Q、P、R、S', 'R、P、Q、S'], optionsEn: ['P, S, R, Q', 'Q, R, S, P', 'Q, P, R, S', 'R, P, Q, S'], answer: 2, explanationZh: 'Q是強二元酸(pH最低)，P是強一元酸，R是中性鹽(pH=7)，S是弱鹼(pH最高)。順序：Q < P < R < S。', explanationEn: 'Q is a strong dibasic acid (lowest pH), P is a strong monobasic acid, R is a neutral salt (pH 7), S is a weak alkali (highest pH). Order: Q < P < R < S.' },
                { questionZh: '溶液 A 是 pH 為 3 的水溶液，而溶液 B 是 pH 為 1 的水溶液。下列哪項有關溶液 A 和溶液 B 的陳述正確？', questionEn: 'Solution A is an aqueous solution with pH 3, and solution B is an aqueous solution with pH 1. Which of the following statements about solution A and solution B is correct?', optionsZh: ['溶液 B 中的[H⁺(aq)]是溶液 A 中的[H⁺(aq)]的兩倍。', '溶液 B 中的[H⁺(aq)]是溶液 A 中的[H⁺(aq)]的三倍。', '溶液 B 中的[H⁺(aq)]是溶液 A 中的[H⁺(aq)]的十倍。', '溶液 B 中的[H⁺(aq)]是溶液 A 中的[H⁺(aq)]的一百倍。'], optionsEn: ['The [H⁺(aq)] in solution B is twice that in solution A.', 'The [H⁺(aq)] in solution B is three times that in solution A.', 'The [H⁺(aq)] in solution B is ten times that in solution A.', 'The [H⁺(aq)] in solution B is one hundred times that in solution A.'], answer: 3, explanationZh: 'pH每相差1，氫離子濃度相差10倍。pH相差2，濃度相差10^2 = 100倍。', explanationEn: 'A difference of 1 in pH means a 10-fold difference in H+ concentration. A difference of 2 means a 10^2 = 100-fold difference.' },
                { questionZh: '化合物 X 可溶於水，而 X 的水溶液可導電，亦能令紅色石蕊試紙變為藍色。下列哪項推斷正確？', questionEn: 'Compound X is soluble in water, and its aqueous solution can conduct electricity and turn red litmus paper blue. Which of the following deductions is correct?', optionsZh: ['X 在水中完全離解。', 'X 不溶於有機溶劑。', 'X 的化學式中至少含有一個氫氧離子。', '在 X 的水溶液中，OH⁻(aq)離子的濃度較 H⁺(aq)離子的高。'], optionsEn: ['X completely dissociates in water.', 'X is insoluble in organic solvents.', 'The chemical formula of X contains at least one hydroxide ion.', 'In the aqueous solution of X, the concentration of OH⁻(aq) ions is higher than that of H⁺(aq) ions.'], answer: 3, explanationZh: '能使紅色石蕊變藍代表溶液呈鹼性，即溶液中OH-濃度高於H+濃度。', explanationEn: 'Turning red litmus blue indicates an alkaline solution, meaning the concentration of OH- is higher than that of H+.' },
                { questionZh: '把下列哪個溶液加入 100.0 cm³ 的 2.0 M 氫氯酸時不會改變酸的 pH？', questionEn: 'Which of the following solutions, when added to 100.0 cm³ of 2.0 M hydrochloric acid, will not change the pH of the acid?', optionsZh: ['100.0 cm³ 的 2.0 M 氯化鉀溶液', '100.0 cm³ 的 2.0 M 乙酸', '100.0 cm³ 的 2.0 M 硫酸', '100.0 cm³ 的 2.0 M 硝酸'], optionsEn: ['100.0 cm³ of 2.0 M potassium chloride solution', '100.0 cm³ of 2.0 M ethanoic acid', '100.0 cm³ of 2.0 M sulphuric acid', '100.0 cm³ of 2.0 M nitric acid'], answer: 3, explanationZh: '2.0 M 硝酸是一元強酸，其H+濃度與2.0 M HCl相同。混合後H+總濃度不變，pH不變。', explanationEn: '2.0 M nitric acid is a strong monobasic acid with the same H+ concentration as 2.0 M HCl. Mixing them keeps the overall H+ concentration and pH unchanged.' },
                { questionZh: '把 150 cm³ 的 0.3 M 氫氯酸與 50 cm³ 的 0.1 M 氫氯酸混合，所得的溶液的 pH 是多少？', questionEn: 'What is the pH of the resulting solution when 150 cm³ of 0.3 M hydrochloric acid is mixed with 50 cm³ of 0.1 M hydrochloric acid?', optionsZh: ['0.2', '0.4', '0.6', '0.8'], optionsEn: ['0.2', '0.4', '0.6', '0.8'], answer: 2, explanationZh: '總H+摩爾數 = 0.3*0.15 + 0.1*0.05 = 0.05 mol。總體積 = 0.2 L。新濃度 = 0.05/0.2 = 0.25 M。pH = -log(0.25) ≈ 0.6。', explanationEn: 'Total H+ moles = 0.3*0.15 + 0.1*0.05 = 0.05 mol. Total volume = 0.2 L. New conc. = 0.05/0.2 = 0.25 M. pH = -log(0.25) ≈ 0.6.' },
                { questionZh: '把 5 cm³ 的 0.1 M 氫氧化鈉溶液與 5 cm³ 的 0.1 M 硫酸混合，所產生混合物的 pH 是多少？', questionEn: 'What is the pH of the resulting mixture when 5 cm³ of 0.1 M sodium hydroxide solution is mixed with 5 cm³ of 0.1 M sulphuric acid?', optionsZh: ['1.0', '1.3', '5.7', '7.0'], optionsEn: ['1.0', '1.3', '5.7', '7.0'], answer: 1, explanationZh: 'H2SO4提供 0.1*2*5=1 mmol H+。NaOH提供 0.1*5=0.5 mmol OH-。剩餘 0.5 mmol H+。總體積 10 cm³。濃度 = 0.5/10 = 0.05 M。pH = -log(0.05) ≈ 1.3。', explanationEn: 'H2SO4 gives 1 mmol H+. NaOH gives 0.5 mmol OH-. Remaining H+ = 0.5 mmol in 10 cm³. Conc = 0.05 M. pH = -log(0.05) ≈ 1.3.' },
                { questionZh: '某硝酸樣本的 pH 是 0.0。下列哪個物質能使 10 cm³ 該硝酸的 pH 上升至 1.00？', questionEn: 'A sample of nitric acid has a pH of 0.0. Which of the following substances can increase the pH of 10 cm³ of this nitric acid to 1.00?', optionsZh: ['90 cm³ 的 0.010 M 硝酸', '90 cm³ 的蒸餾水', '100 cm³ 的蒸餾水', '100 cm³ 的 0.010 M 氫氧化鈉溶液'], optionsEn: ['90 cm³ of 0.010 M nitric acid', '90 cm³ of distilled water', '100 cm³ of distilled water', '100 cm³ of 0.010 M sodium hydroxide solution'], answer: 1, explanationZh: 'pH=0代表[H+]=1M。要使pH升至1，[H+]需降至0.1M，即稀釋10倍。原體積10cm³，需加水至100cm³，即加入90cm³蒸餾水。', explanationEn: 'pH 0 means [H+]=1M. To reach pH 1, [H+] must be 0.1M (diluted 10 times). Initial volume is 10cm³, so total volume must be 100cm³, requiring 90cm³ of water.' },
                { questionZh: '第一述句：未受污染的雨水呈酸性。\n第二述句：未受污染的雨水含有已溶的二氧化碳。', questionEn: '1st statement: Unpolluted rainwater is acidic.\n2nd statement: Unpolluted rainwater contains dissolved carbon dioxide.', optionsZh: ['兩述句均正確，而第二述句為第一述句的合理解釋。', '兩述句均正確，但第二述句並非第一述句的合理解釋。', '第一述句錯誤，但第二述句正確。', '兩述句均錯誤。'], optionsEn: ['Both statements are true, and the 2nd statement is a correct explanation of the 1st statement.', 'Both statements are true, but the 2nd statement is NOT a correct explanation of the 1st statement.', 'The 1st statement is false, but the 2nd statement is true.', 'Both statements are false.'], answer: 0, explanationZh: '空氣中天然含有二氧化碳，溶於雨水形成微酸性的碳酸，這是未受污染雨水呈微酸性(pH約5.6)的原因。', explanationEn: 'Air naturally contains CO2, which dissolves in rainwater to form weak carbonic acid, explaining why unpolluted rainwater is slightly acidic (pH ~5.6).' },
                { questionZh: '第一述句：二氧化碳是酸性氣體。\n第二述句：二氧化碳溶於水中，生成 pH 低於 7 的溶液。', questionEn: '1st statement: Carbon dioxide is an acidic gas.\n2nd statement: Carbon dioxide dissolves in water to form a solution with a pH lower than 7.', optionsZh: ['兩述句均正確，而第二述句為第一述句的合理解釋。', '兩述句均正確，但第二述句並非第一述句的合理解釋。', '第一述句錯誤，但第二述句正確。', '兩述句均錯誤。'], optionsEn: ['Both statements are true, and the 2nd statement is a correct explanation of the 1st statement.', 'Both statements are true, but the 2nd statement is NOT a correct explanation of the 1st statement.', 'The 1st statement is false, but the 2nd statement is true.', 'Both statements are false.'], answer: 0, explanationZh: '二氧化碳被歸類為酸性氣體，正是因為它溶於水會生成酸性溶液（碳酸）。', explanationEn: 'CO2 is classified as an acidic gas precisely because it dissolves in water to form an acidic solution (carbonic acid).' },
                { questionZh: '第一述句：鹼性溶液不含任何氫離子。\n第二述句：鹼溶於水中時便離解或電離，生成氫氧離子作為唯一陰離子。', questionEn: '1st statement: Alkaline solutions do not contain any hydrogen ions.\n2nd statement: Alkalis dissociate or ionize in water to produce hydroxide ions as the only anions.', optionsZh: ['兩述句均正確，而第二述句為第一述句的合理解釋。', '兩述句均正確，但第二述句並非第一述句的合理解釋。', '第一述句錯誤，但第二述句正確。', '兩述句均錯誤。'], optionsEn: ['Both statements are true, and the 2nd statement is a correct explanation of the 1st statement.', 'Both statements are true, but the 2nd statement is NOT a correct explanation of the 1st statement.', 'The 1st statement is false, but the 2nd statement is true.', 'Both statements are false.'], answer: 2, explanationZh: '所有水溶液（包括鹼性溶液）都含有氫離子，只是在鹼性溶液中其濃度低於氫氧離子。第一句錯。', explanationEn: 'All aqueous solutions (including alkaline ones) contain hydrogen ions, but in alkaline solutions, their concentration is lower than that of hydroxide ions. 1st statement is false.' },
                { questionZh: '第一述句：把硫酸銅(II) 溶液加入氫氧化鈉溶液會使氫氧化鈉溶液的 pH 下降。\n第二述句：氫氧化銅(II) 是不溶於水的藍色固體。', questionEn: '1st statement: Adding copper(II) sulphate solution to sodium hydroxide solution will decrease the pH of the sodium hydroxide solution.\n2nd statement: Copper(II) hydroxide is a blue solid insoluble in water.', optionsZh: ['兩述句均正確，而第二述句為第一述句的合理解釋。', '兩述句均正確，但第二述句並非第一述句的合理解釋。', '第一述句錯誤，但第二述句正確。', '兩述句均錯誤。'], optionsEn: ['Both statements are true, and the 2nd statement is a correct explanation of the 1st statement.', 'Both statements are true, but the 2nd statement is NOT a correct explanation of the 1st statement.', 'The 1st statement is false, but the 2nd statement is true.', 'Both statements are false.'], answer: 1, explanationZh: '銅離子與OH-反應生成沉澱，消耗了OH-，導致pH下降。第二句是事實，但未能直接解釋為何pH下降（消耗OH-才是原因）。', explanationEn: 'Copper ions react with OH- to form a precipitate, consuming OH- and lowering pH. The 2nd statement is a fact but doesn\'t explicitly explain the pH drop (the consumption of OH- does).' },
                { questionZh: '第一述句：石灰水的 pH 較水的高。\n第二述句：石灰水中 OH⁻(aq)離子的濃度較水中的高。', questionEn: '1st statement: The pH of limewater is higher than that of water.\n2nd statement: The concentration of OH⁻(aq) ions in limewater is higher than that in water.', optionsZh: ['兩述句均正確，而第二述句為第一述句的合理解釋。', '兩述句均正確，但第二述句並非第一述句的合理解釋。', '第一述句錯誤，但第二述句正確。', '兩述句均錯誤。'], optionsEn: ['Both statements are true, and the 2nd statement is a correct explanation of the 1st statement.', 'Both statements are true, but the 2nd statement is NOT a correct explanation of the 1st statement.', 'The 1st statement is false, but the 2nd statement is true.', 'Both statements are false.'], answer: 0, explanationZh: '石灰水是鹼性溶液，含有較高濃度的氫氧離子，因此其pH值大於純水（pH 7）。', explanationEn: 'Limewater is alkaline and has a higher OH- concentration, which directly explains why its pH is higher than that of pure water.' },
                { questionZh: '第一述句：pH 為 2.5 的溶液的酸度較 pH 為 4.5 的溶液的酸度高。\n第二述句：溶液的 pH 越高，它所含氫離子的濃度便越低。', questionEn: '1st statement: The acidity of a solution with pH 2.5 is higher than that of a solution with pH 4.5.\n2nd statement: The higher the pH of a solution, the lower the concentration of hydrogen ions it contains.', optionsZh: ['兩述句均正確，而第二述句為第一述句的合理解釋。', '兩述句均正確，但第二述句並非第一述句的合理解釋。', '第一述句錯誤，但第二述句正確。', '兩述句均錯誤。'], optionsEn: ['Both statements are true, and the 2nd statement is a correct explanation of the 1st statement.', 'Both statements are true, but the 2nd statement is NOT a correct explanation of the 1st statement.', 'The 1st statement is false, but the 2nd statement is true.', 'Both statements are false.'], answer: 0, explanationZh: 'pH值越低代表氫離子濃度越高（酸度越高），第二句正確解釋了第一句。', explanationEn: 'A lower pH means a higher hydrogen ion concentration (higher acidity), so the 2nd statement correctly explains the 1st.' },
                { questionZh: '第一述句：pH 為 0 的溶液的酸度較 pH 為 1 的溶液的高。\n第二述句：pH 為 0 的溶液中 H⁺(aq)的濃度是 1 M，而 pH 為 1 的溶液中 H⁺(aq)的濃度是 0.1 M。', questionEn: '1st statement: The acidity of a solution with pH 0 is higher than that of a solution with pH 1.\n2nd statement: The concentration of H⁺(aq) in a solution with pH 0 is 1 M, while the concentration of H⁺(aq) in a solution with pH 1 is 0.1 M.', optionsZh: ['兩述句均正確，而第二述句為第一述句的合理解釋。', '兩述句均正確，但第二述句並非第一述句的合理解釋。', '第一述句錯誤，但第二述句正確。', '兩述句均錯誤。'], optionsEn: ['Both statements are true, and the 2nd statement is a correct explanation of the 1st statement.', 'Both statements are true, but the 2nd statement is NOT a correct explanation of the 1st statement.', 'The 1st statement is false, but the 2nd statement is true.', 'Both statements are false.'], answer: 0, explanationZh: 'pH = -log[H+]。pH 0對應1M，pH 1對應0.1M。濃度越高酸度越高，完美解釋。', explanationEn: 'pH = -log[H+]. pH 0 means 1M, pH 1 means 0.1M. Higher concentration means higher acidity, perfectly explaining the 1st statement.' },
                { questionZh: '第一述句：在稀氫氯酸中只可找到 H⁺(aq)離子和 Cl⁻(aq)離子。\n第二述句：氯化氫分子在水中電離，生成 H⁺(aq)離子和 Cl⁻(aq)離子。', questionEn: '1st statement: Only H⁺(aq) ions and Cl⁻(aq) ions can be found in dilute hydrochloric acid.\n2nd statement: Hydrogen chloride molecules ionize in water to form H⁺(aq) ions and Cl⁻(aq) ions.', optionsZh: ['兩述句均正確，而第二述句為第一述句的合理解釋。', '兩述句均正確，但第二述句並非第一述句的合理解釋。', '第一述句錯誤，但第二述句正確。', '兩述句均錯誤。'], optionsEn: ['Both statements are true, and the 2nd statement is a correct explanation of the 1st statement.', 'Both statements are true, but the 2nd statement is NOT a correct explanation of the 1st statement.', 'The 1st statement is false, but the 2nd statement is true.', 'Both statements are false.'], answer: 2, explanationZh: '水溶液中必定會發生水的自偶電離，因此稀氫氯酸中除了H+和Cl-，還有極少量的OH-離子。第一句錯。', explanationEn: 'Due to the autoionization of water, all aqueous solutions contain some OH- ions. Thus, dilute HCl also contains a tiny amount of OH- ions. 1st statement is false.' }
            ],
            // 16.2 測定物質pH值的方法
            'acids_ch16_2': [
                { questionZh: '化合物 Z 的無色水溶液能導電並把藍色石蕊試紙變紅。這可推斷', questionEn: 'A colourless aqueous solution of compound Z can conduct electricity and turns blue litmus paper red. It can be deduced that', optionsZh: ['Z 必定是離子化合物。', 'Z 的化學式必定含有氫。', 'Z 的溶液必定含離子多於分子。', 'Z 的溶液必定含 H⁺ 離子多於 OH⁻ 離子。'], optionsEn: ['Z must be an ionic compound.', 'Z must contain hydrogen in its chemical formula.', 'solution of Z must contain more ions than molecules.', 'solution of Z must contain more H⁺ ions than OH⁻ ions.'], answer: 3, explanationZh: '使藍色石蕊變紅表示溶液呈酸性，即溶液中H+離子濃度大於OH-離子濃度。', explanationEn: 'Turning blue litmus red indicates an acidic solution, meaning the concentration of H+ ions is greater than that of OH- ions.' },
                { questionZh: '把溶液 Y 逐滴加進含數滴酚酞的 NaOH 中，混合物突然由粉紅色變成無色。下列的物質，何者可能是 Y？\n(1) HCl(aq)\n(2) KCl(aq)\n(3) Cl₂(aq)', questionEn: 'Solution Y is added dropwise to a solution of NaOH containing several drops of phenolphthalein. The mixture suddenly changes from pink to colourless. Which of the following substances may Y be?\n(1) HCl(aq)\n(2) KCl(aq)\n(3) Cl₂(aq)', optionsZh: ['只有 (1)', '只有 (2)', '只有 (1) 和 (3)', '只有 (2) 和 (3)'], optionsEn: ['(1) only', '(2) only', '(1) and (3) only', '(2) and (3) only'], answer: 2, explanationZh: '酚酞由紅變無色，代表鹼被中和或消耗。HCl是酸能中和NaOH；氯氣溶於水生成酸，也能中和NaOH。', explanationEn: 'Phenolphthalein turning colourless means the alkali is neutralized. HCl is an acid. Chlorine dissolves in water to form acids, which also neutralize NaOH.' },
                { questionZh: '下列哪些有關甲基橙的陳述不正確？\n(1) 它能顯示溶液的 pH。\n(2) 它在 pH 為 7 的水溶液中呈橙色。\n(3) 它可用來辨別蒸餾水和氨水。', questionEn: 'Which of the following statements about methyl orange are incorrect?\n(1) It can indicate the pH of a solution.\n(2) It is orange in an aqueous solution with a pH of 7.\n(3) It can be used to distinguish between distilled water and ammonia solution.', optionsZh: ['只有(1)和(2)', '只有(1)和(3)', '只有(2)和(3)', '(1)、(2)和(3)'], optionsEn: ['(1) and (2) only', '(1) and (3) only', '(2) and (3) only', '(1), (2) and (3)'], answer: 3, explanationZh: '甲基橙只能顯示酸鹼範圍，不能準確顯示pH值(1錯)。在pH 7和氨水(鹼)中它都呈黃色，無法辨別兩者(3錯)。', explanationEn: 'Methyl orange only shows pH ranges, not specific pH values (1 is false). It is yellow in both pH 7 and ammonia, so it cannot distinguish them (3 is false).' },
                { questionZh: '溶液 X 使甲基橙變為黃色，也使酚酞變為無色。下列哪項可能是溶液 X 的 pH？', questionEn: 'Solution X turns methyl orange yellow and phenolphthalein colourless. Which of the following could be the pH of solution X?', optionsZh: ['2', '5', '9', '11'], optionsEn: ['2', '5', '9', '11'], answer: 1, explanationZh: '甲基橙變黃代表pH > 4.4；酚酞無色代表pH < 8.3。符合此範圍的只有pH 5。', explanationEn: 'Methyl orange is yellow at pH > 4.4; phenolphthalein is colourless at pH < 8.3. The only option in this range is pH 5.' },
                { questionZh: '下列哪個或哪些有關酸鹼指示劑的組合正確？\n(1) 石蕊: 高度酸性=紅色, 高度鹼性=藍色\n(2) 甲基橙: 高度酸性=紅色, 高度鹼性=橙色\n(3) 酚酞: 高度酸性=粉紅色, 高度鹼性=無色', questionEn: 'Which of the following combinations about acid-base indicators is/are correct?\n(1) Litmus: Highly acidic=Red, Highly alkaline=Blue\n(2) Methyl orange: Highly acidic=Red, Highly alkaline=Orange\n(3) Phenolphthalein: Highly acidic=Pink, Highly alkaline=Colourless', optionsZh: ['只有(1)', '只有(2)', '只有(1)和(3)', '只有(2)和(3)'], optionsEn: ['(1) only', '(2) only', '(1) and (3) only', '(2) and (3) only'], answer: 0, explanationZh: '甲基橙在鹼性中是黃色；酚酞在酸性中無色，鹼性中粉紅色。只有(1)正確。', explanationEn: 'Methyl orange is yellow in alkali. Phenolphthalein is colourless in acid and pink in alkali. Only (1) is correct.' },
                { questionZh: '下列哪個酸鹼指示劑可用來最準確地測定某溶液的 pH？', questionEn: 'Which of the following acid-base indicators can be used to most accurately determine the pH of a solution?', optionsZh: ['通用指示劑', '石蕊溶液', '甲基橙', '酚酞'], optionsEn: ['Universal indicator', 'Litmus solution', 'Methyl orange', 'Phenolphthalein'], answer: 0, explanationZh: '通用指示劑在不同pH值下會呈現多種不同顏色，能給出最接近的pH估值。', explanationEn: 'Universal indicator shows a spectrum of colours across different pH values, providing the most accurate pH estimate among the choices.' },
                { questionZh: '下列哪個或哪些物質可用來測定某藍色墨水樣本的 pH？\n(1) pH 試紙\n(2) pH 計\n(3) 通用指示劑', questionEn: 'Which of the following substances can be used to determine the pH of a blue ink sample?\n(1) pH paper\n(2) pH meter\n(3) Universal indicator', optionsZh: ['只有(1)', '只有(2)', '只有(1)和(3)', '只有(2)和(3)'], optionsEn: ['(1) only', '(2) only', '(1) and (3) only', '(2) and (3) only'], answer: 1, explanationZh: '藍色墨水本身有深色，會掩蓋指示劑或試紙的顏色變化，因此只能使用不受顏色影響的pH計。', explanationEn: 'Blue ink is strongly coloured and will mask the colour changes of pH paper or universal indicator. A pH meter must be used as it is unaffected by colour.' },
                { questionZh: '下表列出兩個指示劑的一些資料。\n甲基橙: 由紅色變為黃色 (pH 3.5)\n甲基紅: 由紅色變為黃色 (pH 5.5)\n下表顯示四個水溶液的 pH。\nP: 2.0, Q: 3.0, R: 4.0, S: 7.0\n在下列哪個或哪些溶液中兩個指示劑均呈黃色？', questionEn: 'The table lists some information about two indicators.\nMethyl orange: Red to Yellow (pH 3.5)\nMethyl red: Red to Yellow (pH 5.5)\nThe table shows the pH of four aqueous solutions.\nP: 2.0, Q: 3.0, R: 4.0, S: 7.0\nIn which of the following solutions will both indicators appear yellow?', optionsZh: ['只有 P', '只有 Q 和 R', '只有 R 和 S', '只有 S'], optionsEn: ['P only', 'Q and R only', 'R and S only', 'S only'], answer: 3, explanationZh: '要讓兩者皆呈黃色，pH必須大於5.5。只有溶液S (pH 7.0)符合。', explanationEn: 'For both to be yellow, the pH must be > 5.5. Only solution S (pH 7.0) satisfies this.' },
                { questionZh: '下圖顯示指示劑 X 在不同 pH 範圍所呈現的顏色。\npH 0-3: 紅色\npH 3-5: 綠色\npH 5-14: 藍色\n指示劑 X 可用來辨別', questionEn: 'The figure shows the colours of indicator X at different pH ranges.\npH 0-3: Red\npH 3-5: Green\npH 5-14: Blue\nIndicator X can be used to distinguish between', optionsZh: ['1.0 M 氯化鈉溶液和石灰水。', '1.0 M 氫氯酸和蒸餾水。', '1.0 M 氨水和 1.0 M 氫氧化鈉溶液。', '蒸餾水和石灰水。'], optionsEn: ['1.0 M sodium chloride solution and limewater.', '1.0 M hydrochloric acid and distilled water.', '1.0 M ammonia solution and 1.0 M sodium hydroxide solution.', 'distilled water and limewater.'], answer: 1, explanationZh: '1.0 M HCl (pH 0) 呈紅色，蒸餾水 (pH 7) 呈藍色，顏色不同可辨別。其他選項的兩者pH皆大於5，都會呈藍色。', explanationEn: '1.0 M HCl (pH 0) gives red, while distilled water (pH 7) gives blue. The other pairs both have pH > 5 and would both appear blue.' },
                { questionZh: '把一小塊鈉加入一盆水，下列哪些有關所得的溶液的陳述正確？\n(1) 它是無色的。\n(2) 它在焰色試驗中產生金黃色火焰。\n(3) 酚酞可用來測定它的 pH。', questionEn: 'A small piece of sodium is added to a basin of water. Which of the following statements about the resulting solution are correct?\n(1) It is colourless.\n(2) It produces a golden yellow flame in a flame test.\n(3) Phenolphthalein can be used to determine its pH.', optionsZh: ['只有(1)和(2)', '只有(1)和(3)', '只有(2)和(3)', '(1)、(2)和(3)'], optionsEn: ['(1) and (2) only', '(1) and (3) only', '(2) and (3) only', '(1), (2) and (3)'], answer: 0, explanationZh: '鈉與水反應生成無色的氫氧化鈉溶液，含鈉離子（金黃色火焰）。酚酞只能顯示鹼性，不能「測定」具體pH值。', explanationEn: 'Sodium reacts with water to form a colourless NaOH solution (golden yellow flame). Phenolphthalein only indicates alkalinity, it cannot "determine" the exact pH.' },
                { questionZh: '把一塊鉀加入盛有含數滴甲基橙的冷水的燒杯，下列哪項或哪些是預期的觀察？\n(1) 鉀塊燃燒並產生淡紫色火焰。\n(2) 鉀塊沉到燒杯的底部。\n(3) 指示劑出現顏色變化。', questionEn: 'A piece of potassium is added to a beaker of cold water containing a few drops of methyl orange. Which of the following is/are expected observations?\n(1) The potassium piece burns with a pale lilac flame.\n(2) The potassium piece sinks to the bottom of the beaker.\n(3) The indicator shows a colour change.', optionsZh: ['只有(1)', '只有(2)', '只有(1)和(3)', '只有(2)和(3)'], optionsEn: ['(1) only', '(2) only', '(1) and (3) only', '(2) and (3) only'], answer: 2, explanationZh: '鉀浮在水面（密度小於水）並燃燒生淡紫色火焰。甲基橙在水(pH 7)中已是黃色，反應後生成KOH(鹼性)仍是黃色，無顏色變化。', explanationEn: 'Potassium floats (less dense than water) and burns with a lilac flame. Methyl orange is yellow in water and remains yellow in the alkaline KOH formed, so no colour change.' },
                { questionZh: '通用指示劑在四個溶液中所呈現的顏色總結如下：\n溶液 W: 橙色\n溶液 X: 藍色\n溶液 Y: 綠色\n溶液 Z: 紅色\n下列哪項顯示該四個溶液 pH 遞增的次序？', questionEn: 'The colours of universal indicator in four solutions are summarized below:\nSolution W: Orange\nSolution X: Blue\nSolution Y: Green\nSolution Z: Red\nWhich of the following shows the increasing order of pH of the four solutions?', optionsZh: ['W、X、Y、Z', 'X、Y、Z、W', 'Z、W、Y、X', 'X、Y、W、Z'], optionsEn: ['W, X, Y, Z', 'X, Y, Z, W', 'Z, W, Y, X', 'X, Y, W, Z'], answer: 2, explanationZh: '通用指示劑顏色：紅(強酸) < 橙(弱酸) < 綠(中性) < 藍(鹼性)。因此pH遞增順序為 Z < W < Y < X。', explanationEn: 'Universal indicator colours: Red (strong acid) < Orange (weak acid) < Green (neutral) < Blue (alkali). Order of increasing pH: Z < W < Y < X.' },
                { questionZh: '第一述句：酚酞在酸性溶液中呈無色。\n第二述句：在酸性溶液中，氫離子的濃度較氫氧離子的高。', questionEn: '1st statement: Phenolphthalein is colourless in acidic solutions.\n2nd statement: In acidic solutions, the concentration of hydrogen ions is higher than that of hydroxide ions.', optionsZh: ['兩述句均正確，而第二述句為第一述句的合理解釋。', '兩述句均正確，但第二述句並非第一述句的合理解釋。', '第一述句錯誤，但第二述句正確。', '兩述句均錯誤。'], optionsEn: ['Both statements are true, and the 2nd statement is a correct explanation of the 1st statement.', 'Both statements are true, but the 2nd statement is NOT a correct explanation of the 1st statement.', 'The 1st statement is false, but the 2nd statement is true.', 'Both statements are false.'], answer: 1, explanationZh: '兩句皆正確，但第二句只是定義了酸性溶液，並沒有解釋「為何」酚酞在酸性中會呈無色（這與指示劑分子的結構變化有關）。', explanationEn: 'Both are true, but the 2nd statement only defines an acidic solution; it does not explain the structural change in the phenolphthalein molecule that makes it colourless.' },
                { questionZh: '第一述句：酚酞在鹼性溶液中呈粉紅色。\n第二述句：銹蝕指示劑含有酚酞。', questionEn: '1st statement: Phenolphthalein is pink in alkaline solutions.\n2nd statement: Rust indicator contains phenolphthalein.', optionsZh: ['兩述句均正確，而第二述句為第一述句的合理解釋。', '兩述句均正確，但第二述句並非第一述句的合理解釋。', '第一述句錯誤，但第二述句正確。', '兩述句均錯誤。'], optionsEn: ['Both statements are true, and the 2nd statement is a correct explanation of the 1st statement.', 'Both statements are true, but the 2nd statement is NOT a correct explanation of the 1st statement.', 'The 1st statement is false, but the 2nd statement is true.', 'Both statements are false.'], answer: 1, explanationZh: '兩句皆正確。銹蝕指示劑含酚酞來檢測陰極產生的OH-，但這並非酚酞在鹼性中呈粉紅色的原因。', explanationEn: 'Both are true. Rust indicator uses phenolphthalein to detect OH- at the cathode, but this doesn\'t explain why phenolphthalein is pink in alkalis.' },
                { questionZh: '第一述句：通用指示劑能準確地量度溶液的 pH。\n第二述句：通用指示劑在不同的 pH 呈現不同的顏色。', questionEn: '1st statement: Universal indicator can accurately measure the pH of a solution.\n2nd statement: Universal indicator shows different colours at different pH values.', optionsZh: ['兩述句均正確，而第二述句為第一述句的合理解釋。', '兩述句均正確，但第二述句並非第一述句的合理解釋。', '第一述句錯誤，但第二述句正確。', '兩述句均錯誤。'], optionsEn: ['Both statements are true, and the 2nd statement is a correct explanation of the 1st statement.', 'Both statements are true, but the 2nd statement is NOT a correct explanation of the 1st statement.', 'The 1st statement is false, but the 2nd statement is true.', 'Both statements are false.'], answer: 2, explanationZh: '通用指示劑只能給出pH的估值（通常為整數），不能「準確」量度（如小數點後兩位需用pH計）。第一句錯。', explanationEn: 'Universal indicator only estimates pH (usually to whole numbers), it cannot measure it "accurately" (which requires a pH meter). 1st statement is false.' },
                { questionZh: '第一述句：石蕊可用來量度溶液的 pH。\n第二述句：石蕊可顯示溶液的酸度或鹼度。', questionEn: '1st statement: Litmus can be used to measure the pH of a solution.\n2nd statement: Litmus can indicate the acidity or alkalinity of a solution.', optionsZh: ['兩述句均正確，而第二述句為第一述句的合理解釋。', '兩述句均正確，但第二述句並非第一述句的合理解釋。', '第一述句錯誤，但第二述句正確。', '兩述句均錯誤。'], optionsEn: ['Both statements are true, and the 2nd statement is a correct explanation of the 1st statement.', 'Both statements are true, but the 2nd statement is NOT a correct explanation of the 1st statement.', 'The 1st statement is false, but the 2nd statement is true.', 'Both statements are false.'], answer: 2, explanationZh: '石蕊只能顯示溶液是酸性還是鹼性（紅或藍），無法量度具體的pH值。第一句錯。', explanationEn: 'Litmus only shows if a solution is acidic or alkaline (red or blue); it cannot measure the specific pH value. 1st statement is false.' }
            ]
        };

        let currentView = 'subtopics';
        let currentSubtopicId = null;
        let currentSectionId = null;
        let currentRangeTargetId = null;
        let currentRangeTitleZh = null;
        let currentRangeTitleEn = null;
        
        let currentQuestions = [];
        let currentQuestionIndex = 0;
        let currentGlobalOffset = 0; 
        let userAnswers = [];
        let score = 0;

        function showModal(message) {
            document.getElementById('modal-message').innerText = message;
            document.getElementById('custom-modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('custom-modal').classList.add('hidden');
        }

        function toggleLanguage() {
            currentLang = currentLang === 'zh' ? 'en' : 'zh';
            updateUI();
            if (currentView === 'subtopics') renderSubtopics();
            else if (currentView === 'sections') renderSections(currentSubtopicId);
            else if (currentView === 'range') showRangeView(currentRangeTargetId, currentRangeTitleZh, currentRangeTitleEn);
            else if (currentView === 'quiz') {
                let title = currentLang === 'zh' ? currentRangeTitleZh : currentRangeTitleEn;
                document.getElementById('ui-title').innerText = title;
                if (!document.getElementById('result-view').classList.contains('hidden')) showResults(); 
                else renderQuestion();
            }
        }

        function updateUI() {
            const strings = uiStrings[currentLang];
            document.getElementById('lang-text').innerText = strings.langToggle;
            
            if (currentView === 'subtopics') {
                document.getElementById('ui-title').innerText = strings.mainTitle;
                document.getElementById('subtopic-main-title').innerText = strings.mainTitle;
            }
            
            document.getElementById('ui-back').innerText = strings.back;
            document.getElementById('prev-btn').innerText = strings.prev;
            document.getElementById('ui-select-subtopic').innerText = strings.selectSubtopic;
            document.getElementById('ui-select-section').innerText = strings.selectSection;
            document.getElementById('ui-select-range').innerText = strings.selectRange;
            document.getElementById('ui-question-label').innerText = strings.question;

            const customRangeLabel = document.getElementById('ui-custom-range-label');
            if (customRangeLabel) customRangeLabel.innerText = strings.customRange;
            const customRangeBtn = document.getElementById('custom-range-btn');
            if (customRangeBtn) customRangeBtn.innerText = strings.startCustom;

            if (currentQuestions.length > 0 && currentQuestionIndex === currentQuestions.length - 1) {
                document.getElementById('next-btn').innerText = strings.finish;
            } else {
                document.getElementById('next-btn').innerText = strings.next;
            }
            document.getElementById('ui-complete').innerText = strings.complete;
            document.getElementById('ui-score-text').innerText = strings.scoreText;
            document.getElementById('ui-return').innerText = strings.return;
            document.getElementById('ui-wrong-title').innerText = strings.wrongTitle;
            document.getElementById('ui-download-wrong-txt').innerText = strings.downloadWrongTxt;
            document.getElementById('ui-download-wrong-pdf').innerText = strings.downloadWrongPdf;
            document.getElementById('modal-title').innerText = currentLang === 'zh' ? '提示' : 'Notice';
        }

        function getQuestionCount(id) {
            if (questionsData[id]) return questionsData[id].length;
            if (sectionsData[id]) {
                return sectionsData[id].reduce((sum, sec) => sum + (questionsData[sec.id] ? questionsData[sec.id].length : 0), 0);
            }
            if (subtopicsData['acids']) {
                const sub = subtopicsData['acids'].find(s => s.id === id);
                if (sub) return getQuestionCount(sub.id);
            }
            return 0;
        }

        function showSubtopicsView() {
            currentView = 'subtopics';
            document.getElementById('section-view').classList.add('hidden');
            document.getElementById('range-view').classList.add('hidden');
            document.getElementById('quiz-view').classList.add('hidden');
            document.getElementById('subtopic-view').classList.remove('hidden');
            document.getElementById('back-btn').classList.add('hidden'); 
            document.getElementById('ui-title').innerText = uiStrings[currentLang].mainTitle;
            document.getElementById('subtopic-main-title').innerText = uiStrings[currentLang].mainTitle;
            renderSubtopics();
        }

        function renderSubtopics() {
            const container = document.getElementById('subtopics-container');
            container.innerHTML = '';

            const subtopics = subtopicsData['acids'];
            subtopics.forEach(sub => {
                const qCount = getQuestionCount(sub.id);
                const title = currentLang === 'zh' ? sub.titleZh : sub.titleEn;
                const unit = uiStrings[currentLang].qUnit;
                const countBadge = qCount > 0 
                    ? `<span class="bg-emerald-50 text-emerald-600 text-sm px-3 py-1 rounded-full font-medium">${qCount} ${unit}</span>`
                    : `<span class="bg-gray-100 text-gray-400 text-sm px-3 py-1 rounded-full font-medium">0 ${unit}</span>`;

                const card = document.createElement('div');
                card.className = 'subtopic-card bg-white rounded-2xl p-5 border border-gray-200 cursor-pointer flex justify-between items-center hover:shadow-md transition-shadow mb-3';
                
                card.onclick = () => {
                    currentSubtopicId = sub.id;
                    if (sub.hasSections && sectionsData[sub.id]) {
                        showSectionsView(sub);
                    } else {
                        currentSectionId = null;
                        showRangeView(sub.id, sub.titleZh, sub.titleEn);
                    }
                };
                
                card.innerHTML = `<div class="font-bold text-gray-800 text-lg">${title}</div><div>${countBadge}</div>`;
                container.appendChild(card);
            });
        }

        function showSectionsView(subtopic) {
            currentView = 'sections';
            document.getElementById('subtopic-view').classList.add('hidden');
            document.getElementById('range-view').classList.add('hidden');
            document.getElementById('quiz-view').classList.add('hidden');
            document.getElementById('section-view').classList.remove('hidden');
            document.getElementById('back-btn').classList.remove('hidden');
            
            const title = currentLang === 'zh' ? subtopic.titleZh : subtopic.titleEn;
            document.getElementById('section-header-title').innerText = title;
            document.getElementById('ui-title').innerText = title;
            renderSections(subtopic.id);
        }

        function renderSections(subtopicId) {
            const container = document.getElementById('sections-container');
            container.innerHTML = '';
            
            const sections = sectionsData[subtopicId];
            sections.forEach(sec => {
                const qCount = getQuestionCount(sec.id);
                const title = currentLang === 'zh' ? sec.titleZh : sec.titleEn;
                const unit = uiStrings[currentLang].qUnit;
                const countBadge = qCount > 0 
                    ? `<span class="bg-emerald-50 text-emerald-600 text-sm px-3 py-1 rounded-full font-medium">${qCount} ${unit}</span>`
                    : `<span class="bg-gray-100 text-gray-400 text-sm px-3 py-1 rounded-full font-medium">0 ${unit}</span>`;

                const card = document.createElement('div');
                card.className = 'section-card bg-white rounded-2xl p-5 border border-gray-200 cursor-pointer flex justify-between items-center hover:shadow-md transition-shadow mb-3';card.onclick = () => {
                    currentSectionId = sec.id;
                    showRangeView(sec.id, sec.titleZh, sec.titleEn);
                };
                
                card.innerHTML = `<div class="font-bold text-gray-700 text-base pr-4">${title}</div><div>${countBadge}</div>`;
                container.appendChild(card);
            });
        }

        function showRangeView(targetId, titleZh, titleEn) {
            currentView = 'range';
            currentRangeTargetId = targetId;
            currentRangeTitleZh = titleZh;
            currentRangeTitleEn = titleEn;

            document.getElementById('subtopic-view').classList.add('hidden');
            document.getElementById('section-view').classList.add('hidden');
