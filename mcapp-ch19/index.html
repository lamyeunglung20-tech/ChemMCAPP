        function showModal(msg) {
            document.getElementById('modal-msg').innerText = msg;
            document.getElementById('modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('modal').classList.add('hidden');
        }

        function toggleLanguage() {
            currentLang = currentLang === 'zh' ? 'en' : 'zh';
            document.getElementById('lang-toggle-text').innerText = currentLang === 'zh' ? 'English' : '中文';
            updateUI();
            
            // Re-render current view with updated language
            if (currentView === 'subtopics') {
                showSubtopicsView();
            } else if (currentView === 'sections') {
                showSectionsView(subtopicsData['acids'].find(s => s.id === currentSubtopicId));
            } else if (currentView === 'range') {
                showRangeView(currentRangeTargetId, currentRangeTitleZh, currentRangeTitleEn);
            } else if (currentView === 'quiz') {
                updateQuestionSelector();
                renderQuestion();
            } else if (currentView === 'result') {
                showResult();
            }
        }

        document.getElementById('lang-toggle-btn').addEventListener('click', toggleLanguage);

        function updateUI() {
            const strings = uiStrings[currentLang];
            document.getElementById('ui-app-heading').innerText = strings.appTitle;
            document.getElementById('ui-select-chapter-label').innerText = strings.selectChapter;
            if (document.getElementById('ui-select-section-label')) {
                document.getElementById('ui-select-section-label').innerText = strings.selectSection;
            }
            document.getElementById('ui-question-label').innerText = strings.question;
            document.getElementById('ui-prev-text').innerText = strings.prev;
            document.getElementById('ui-next-text').innerText = strings.next;
            document.getElementById('ui-result-title').innerText = strings.resultTitle;
            document.getElementById('ui-final-score-label').innerText = strings.finalScoreLabel;
            document.getElementById('ui-download-wrong-text').innerText = strings.downloadWrong;
            document.getElementById('ui-download-wrong-pdf-text').innerText = strings.downloadWrongPDF;
            document.getElementById('ui-wrong-title').innerHTML = `<i class="fas fa-times-circle text-rose-500"></i> ${strings.wrongTitle}`;
        }

        function getQuestionCount(targetId) {
            return getAllQuestionsForTarget(targetId).length;
        }

        function showSubtopicsView() {
            currentView = 'subtopics';
            currentSectionId = null;

            document.getElementById('subtopic-view').classList.remove('hidden');
            document.getElementById('section-view').classList.add('hidden');
            document.getElementById('range-view').classList.add('hidden');
            document.getElementById('quiz-view').classList.add('hidden');
            document.getElementById('result-view').classList.add('hidden');
            document.getElementById('back-btn').classList.add('hidden');

            document.getElementById('ui-title').innerText = uiStrings[currentLang].appTitle;

            const container = document.getElementById('subtopics-container');
            container.innerHTML = '';

            subtopicsData['acids'].forEach(sec => {
                const count = getQuestionCount(sec.id);
                const title = currentLang === 'zh' ? sec.titleZh : sec.titleEn;
                const countBadge = `<span class="bg-teal-50 text-teal-700 text-sm font-semibold px-3 py-1 rounded-full">${count} ${uiStrings[currentLang].qUnit}</span>`;

                const card = document.createElement('div');
                card.className = 'bg-white rounded-xl p-4 border border-slate-200 hover:border-teal-400 hover:shadow-md transition cursor-pointer flex items-center justify-between';
                card.onclick = () => {
                    currentSubtopicId = sec.id;
                    if (sectionsData[sec.id]) {
                        showSectionsView(sec);
                    } else {
                        showRangeView(sec.id, sec.titleZh, sec.titleEn);
                    }
                };
                card.innerHTML = `<div class="font-bold text-slate-700 text-base pr-4">${title}</div><div>${countBadge}</div>`;
                container.appendChild(card);
            });
        }

        function showSectionsView(subtopic) {
            currentView = 'sections';
            document.getElementById('subtopic-view').classList.add('hidden');
            document.getElementById('section-view').classList.remove('hidden');
            document.getElementById('range-view').classList.add('hidden');
            document.getElementById('quiz-view').classList.add('hidden');
            document.getElementById('result-view').classList.add('hidden');
            document.getElementById('back-btn').classList.remove('hidden');

            const title = currentLang === 'zh' ? subtopic.titleZh : subtopic.titleEn;
            document.getElementById('section-header-title').innerText = title;
            document.getElementById('ui-title').innerText = title;

            const container = document.getElementById('sections-container');
            container.innerHTML = '';

            const sections = sectionsData[subtopic.id] || [];
            sections.forEach(sec => {
                const count = getQuestionCount(sec.id);
                const secTitle = currentLang === 'zh' ? sec.titleZh : sec.titleEn;
                const countBadge = `<span class="bg-teal-50 text-teal-700 text-sm font-semibold px-3 py-1 rounded-full">${count} ${uiStrings[currentLang].qUnit}</span>`;

                const card = document.createElement('div');
                card.className = 'bg-white rounded-xl p-4 border border-slate-200 hover:border-teal-400 hover:shadow-md transition cursor-pointer flex items-center justify-between';
                card.onclick = () => {
                    currentSectionId = sec.id;
                    showRangeView(sec.id, sec.titleZh, sec.titleEn);
                };
                card.innerHTML = `<div class="font-bold text-slate-700 text-base pr-4">${secTitle}</div><div>${countBadge}</div>`;
                container.appendChild(card);
            });
        }

        function showRangeView(targetId, titleZh, titleEn) {
            currentView = 'range';
            currentRangeTargetId = targetId;
            currentRangeTitleZh = titleZh;
            currentRangeTitleEn = titleEn;

            document.getElementById('subtopic-view').classList.add('hidden');
            document.getElementById('section-view').classList.add('hidden');
            document.getElementById('range-view').classList.remove('hidden');
            document.getElementById('quiz-view').classList.add('hidden');
            document.getElementById('result-view').classList.add('hidden');
            document.getElementById('back-btn').classList.remove('hidden');

            const title = currentLang === 'zh' ? titleZh : titleEn;
            document.getElementById('range-header-title').innerText = title;
            document.getElementById('ui-title').innerText = title;

            const totalQs = getQuestionCount(targetId);
            const container = document.getElementById('ranges-container');
            container.innerHTML = '';

            if (totalQs === 0) {
                container.innerHTML = `<div class="col-span-full text-center text-slate-500 py-8">${uiStrings[currentLang].noQuestions}</div>`;
                return;
            }

            // "All Questions" option
            const allCard = document.createElement('div');
            allCard.className = 'bg-white rounded-xl p-4 border border-slate-200 hover:border-teal-400 hover:shadow-md transition cursor-pointer flex flex-col items-center justify-center text-center h-24';
            allCard.onclick = () => startQuiz(targetId, 0, totalQs);
            allCard.innerHTML = `<div class="font-bold text-teal-600 text-lg">${uiStrings[currentLang].allQuestions}</div><div class="text-sm text-slate-500 mt-1">1 - ${totalQs}</div>`;
            container.appendChild(allCard);

            // Chunked ranges (e.g. 1-10, 11-20)
            const chunkSize = 10;
            for (let i = 0; i < totalQs; i += chunkSize) {
                const end = Math.min(i + chunkSize, totalQs);
                const card = document.createElement('div');
                card.className = 'bg-white rounded-xl p-4 border border-slate-200 hover:border-teal-400 hover:shadow-md transition cursor-pointer flex flex-col items-center justify-center text-center h-24';
                card.onclick = () => startQuiz(targetId, i, end);
                card.innerHTML = `<div class="font-bold text-slate-700 text-lg">${i + 1} - ${end}</div>`;
                container.appendChild(card);
            }

            // Custom Range Selection
            const customDiv = document.createElement('div');
            customDiv.className = 'col-span-full bg-white rounded-xl p-5 border border-slate-200 mt-4 shadow-sm';
            customDiv.innerHTML = `
                <div class="font-bold text-slate-700 mb-3">${uiStrings[currentLang].customRange}</div>
                <div class="flex items-center gap-3">
                    <input type="number" id="custom-start" min="1" max="${totalQs}" placeholder="1" class="w-full bg-slate-50 border border-slate-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-teal-500">
                    <span class="text-slate-400 font-bold">-</span>
                    <input type="number" id="custom-end" min="1" max="${totalQs}" placeholder="${totalQs}" class="w-full bg-slate-50 border border-slate-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-teal-500">
                    <button onclick="startCustomQuiz('${targetId}', ${totalQs})" class="whitespace-nowrap px-4 py-2 bg-slate-800 hover:bg-slate-700 text-white font-semibold rounded-lg transition">${uiStrings[currentLang].startCustom}</button>
                </div>
            `;
            container.appendChild(customDiv);
        }

        function startCustomQuiz(targetId, totalQs) {
            let start = parseInt(document.getElementById('custom-start').value);
            let end = parseInt(document.getElementById('custom-end').value);

            if (isNaN(start) || start < 1) start = 1;
            if (isNaN(end) || end > totalQs) end = totalQs;

            if (start > end || start < 1 || end > totalQs) {
                showModal(uiStrings[currentLang].invalidRange);
                return;
            }

            startQuiz(targetId, start - 1, end);
        }

        function getAllQuestionsForTarget(targetId) {
            if (questionsData[targetId]) {
                return questionsData[targetId];
            }
            if (sectionsData[targetId]) {
                let allQs = [];
                sectionsData[targetId].forEach(sec => {
                    if (questionsData[sec.id]) {
                        allQs = allQs.concat(questionsData[sec.id]);
                    }
                });
                return allQs;
            }
            return [];
        }

        function startQuiz(targetId, startIndex, endIndex) {
            const allQs = getAllQuestionsForTarget(targetId);
            currentQuestions = allQs.slice(startIndex, endIndex);
            currentGlobalOffset = startIndex;
            
            if (currentQuestions.length === 0) {
                showModal(uiStrings[currentLang].noQuestions);
                return;
            }

            currentView = 'quiz';
            currentQuestionIndex = 0;
            userAnswers = new Array(currentQuestions.length).fill(null);
            
            document.getElementById('range-view').classList.add('hidden');
            document.getElementById('quiz-view').classList.remove('hidden');

            updateQuestionSelector();
            renderQuestion();
        }

        function updateQuestionSelector() {
            const selector = document.getElementById('question-selector');
            selector.innerHTML = '';
            currentQuestions.forEach((_, index) => {
                const opt = document.createElement('option');
                opt.value = index;
                // Add * if unanswered
                const isAnswered = userAnswers[index] !== null;
                const statusStr = isAnswered ? '' : ' *';
                opt.text = `${currentGlobalOffset + index + 1}${statusStr}`;
                if (index === currentQuestionIndex) opt.selected = true;
                selector.appendChild(opt);
            });
            document.getElementById('question-total-text').innerText = `/ ${currentQuestions.length}`;
        }

        function jumpToQuestion(index) {
            currentQuestionIndex = parseInt(index);
            renderQuestion();
        }

        function renderQuestion() {
            const q = currentQuestions[currentQuestionIndex];
            const qText = currentLang === 'zh' ? q.questionZh : q.questionEn;
            const qOptions = currentLang === 'zh' ? q.optionsZh : q.optionsEn;
            const qExp = currentLang === 'zh' ? q.explanationZh : q.explanationEn;
            
            // Render Text
            document.getElementById('question-text').innerText = `${currentGlobalOffset + currentQuestionIndex + 1}. ${qText}`;
            
            // Render Image (if any)
            const imgContainer = document.getElementById('question-image-container');
            if (q.image) {
                imgContainer.innerHTML = `<img src="${q.image}" alt="Question Image" class="max-w-full h-auto rounded-lg border border-slate-200">`;
                imgContainer.classList.remove('hidden');
            } else {
                imgContainer.innerHTML = '';
                imgContainer.classList.add('hidden');
            }

            // Render Options
            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';
            
            const hasAnswered = userAnswers[currentQuestionIndex] !== null;
            const userAnswer = userAnswers[currentQuestionIndex];

            qOptions.forEach((optText, idx) => {
                const btn = document.createElement('button');
                btn.className = 'w-full text-left p-4 rounded-xl border-2 border-slate-200 bg-white hover:bg-slate-50 font-medium text-slate-700 transition flex items-start gap-3 option-btn';
                
                const letter = String.fromCharCode(65 + idx);
                
                let btnStateClasses = '';
                if (hasAnswered) {
                    btn.disabled = true;
                    btn.classList.remove('hover:bg-slate-50', 'cursor-pointer');
                    
                    if (idx === q.answer) {
                        btnStateClasses = 'correct';
                    } else if (idx === userAnswer) {
                        btnStateClasses = 'wrong';
                    } else {
                        btnStateClasses = 'opacity-50';
                    }
                } else {
                    btn.onclick = () => selectOption(idx);
                }

                if (btnStateClasses) btn.classList.add(...btnStateClasses.split(' '));

                btn.innerHTML = `<span class="font-bold flex-shrink-0 w-6 h-6 flex items-center justify-center rounded-full bg-slate-100 text-slate-600">${letter}</span> <span>${optText}</span>`;
                optionsContainer.appendChild(btn);
            });

            // Explanation
            const expContainer = document.getElementById('explanation-container');
            if (hasAnswered) {
                expContainer.innerHTML = `
                    <div class="mt-5 p-4 bg-blue-50 border border-blue-200 rounded-xl">
                        <div class="font-bold text-blue-800 mb-2 flex items-center gap-2"><i class="fas fa-lightbulb"></i> ${uiStrings[currentLang].explanation}</div>
                        <div class="text-blue-900 whitespace-pre-line text-sm leading-relaxed">${qExp}</div>
                    </div>
                `;
                expContainer.classList.remove('hidden');
            } else {
                expContainer.classList.add('hidden');
            }

            // Navigation Buttons
            document.getElementById('prev-btn').disabled = currentQuestionIndex === 0;
            
            const nextBtn = document.getElementById('next-btn');
            if (currentQuestionIndex === currentQuestions.length - 1) {
                nextBtn.innerHTML = `<i class="fas fa-flag-checkered mr-1"></i> <span id="ui-next-text">${uiStrings[currentLang].finish}</span>`;
                nextBtn.className = 'px-5 py-2.5 bg-rose-500 hover:bg-rose-600 text-white font-semibold rounded-xl transition shadow-md';
                nextBtn.onclick = checkFinish;
            } else {
                nextBtn.innerHTML = `<span id="ui-next-text">${uiStrings[currentLang].next}</span> <i class="fas fa-chevron-right ml-1"></i>`;
                nextBtn.className = 'px-5 py-2.5 bg-teal-500 hover:bg-teal-600 text-white font-semibold rounded-xl transition shadow-md';
                nextBtn.onclick = () => {
                    currentQuestionIndex++;
                    updateQuestionSelector();
                    renderQuestion();
                };
            }
            
            // Sync selector UI (remove *)
            const selector = document.getElementById('question-selector');
            selector.value = currentQuestionIndex;
        }

        function selectOption(idx) {
            userAnswers[currentQuestionIndex] = idx;
            updateQuestionSelector();
            renderQuestion();
        }

        function checkFinish() {
            const unansweredCount = userAnswers.filter(a => a === null).length;
            if (unansweredCount > 0) {
                const msg = uiStrings[currentLang].confirmFinish.replace('{unanswered}', unansweredCount);
                if (confirm(msg)) {
                    showResult();
                }
            } else {
                showResult();
            }
        }

        function showResult() {
            currentView = 'result';
            document.getElementById('quiz-view').classList.add('hidden');
            document.getElementById('result-view').classList.remove('hidden');

            score = 0;
            const wrongQuestions = [];

            userAnswers.forEach((ans, idx) => {
                if (ans === currentQuestions[idx].answer) {
                    score++;
                } else {
                    wrongQuestions.push({
                        globalIndex: currentGlobalOffset + idx + 1,
                        question: currentQuestions[idx],
                        userAns: ans
                    });
                }
            });

            document.getElementById('final-score').innerText = `${score} / ${currentQuestions.length}`;

            const wrongList = document.getElementById('wrong-questions-list');
            const wrongSection = document.getElementById('wrong-questions-section');
            const downloadBtn = document.getElementById('download-wrong-buttons');
            
            wrongList.innerHTML = '';

            if (wrongQuestions.length > 0) {
                wrongSection.classList.remove('hidden');
                downloadBtn.classList.remove('hidden');

                wrongQuestions.forEach(wq => {
                    const q = wq.question;
                    const qText = currentLang === 'zh' ? q.questionZh : q.questionEn;
                    const qOptions = currentLang === 'zh' ? q.optionsZh : q.optionsEn;
                    const qExp = currentLang === 'zh' ? q.explanationZh : q.explanationEn;
                    
                    const uAnsStr = wq.userAns !== null ? String.fromCharCode(65 + wq.userAns) + ". " + qOptions[wq.userAns] : uiStrings[currentLang].unanswered;
                    const cAnsStr = String.fromCharCode(65 + q.answer) + ". " + qOptions[q.answer];

                    // Generate Options HTML for the Wrong Question Review
                    let optionsListHtml = '<div class="mt-3 mb-4 space-y-2">';
                    qOptions.forEach((optText, i) => {
                        const letter = String.fromCharCode(65 + i);
                        optionsListHtml += `<div class="text-slate-700 flex items-start gap-2"><span class="font-bold text-slate-500 w-5 flex-shrink-0">${letter}.</span> <span>${optText}</span></div>`;
                    });
                    optionsListHtml += '</div>';

                    const item = document.createElement('div');
                    item.className = 'bg-slate-50 border border-slate-200 rounded-xl p-4';
                    
                    let imgHtml = '';
                    if (q.image) {
                        imgHtml = `<div class="my-3 flex justify-center"><img src="${q.image}" class="max-w-full h-auto rounded border border-slate-200"></div>`;
                    }

                    item.innerHTML = `
                        <div class="font-bold text-slate-800 mb-2 whitespace-pre-line">Q${wq.globalIndex}. ${qText}</div>
                        ${imgHtml}
                        ${optionsListHtml}
                        <div class="text-sm space-y-1 mb-3 pt-3 border-t border-slate-200">
                            <div class="text-rose-600"><span class="font-semibold">${uiStrings[currentLang].yourAns}:</span> ${uAnsStr}</div>
                            <div class="text-emerald-600"><span class="font-semibold">${uiStrings[currentLang].correctAns}:</span> ${cAnsStr}</div>
                        </div>
                        <div class="bg-white p-3 rounded-lg border border-slate-200 text-sm text-slate-700 whitespace-pre-line"><span class="font-bold"><i class="fas fa-lightbulb text-amber-500"></i> ${uiStrings[currentLang].explanation}:</span><br>${qExp}</div>
                    `;
                    wrongList.appendChild(item);
                });
            } else {
                wrongSection.classList.add('hidden');
                downloadBtn.classList.add('hidden');
            }
        }

        function downloadWrongQuestionsTXT() {
            const wrongQuestions = [];
            userAnswers.forEach((ans, idx) => {
                if (ans !== currentQuestions[idx].answer) {
                    wrongQuestions.push({
                        globalIndex: currentGlobalOffset + idx + 1,
                        question: currentQuestions[idx],
                        userAns: ans
                    });
                }
            });

            if (wrongQuestions.length === 0) {
                showModal(uiStrings[currentLang].noWrongQuestions);
                return;
            }

            let txtContent = `${uiStrings[currentLang].wrongTitle}\n`;
            txtContent += `=========================================\n\n`;

            wrongQuestions.forEach(wq => {
                const q = wq.question;
                const qText = currentLang === 'zh' ? q.questionZh : q.questionEn;
                const qOptions = currentLang === 'zh' ? q.optionsZh : q.optionsEn;
                const qExp = currentLang === 'zh' ? q.explanationZh : q.explanationEn;

                const uAnsStr = wq.userAns !== null ? String.fromCharCode(65 + wq.userAns) + ". " + qOptions[wq.userAns] : uiStrings[currentLang].unanswered;
                const cAnsStr = String.fromCharCode(65 + q.answer) + ". " + qOptions[q.answer];

                txtContent += `Q${wq.globalIndex}.\n${qText}\n\n`;
                qOptions.forEach((opt, i) => {
                    txtContent += `${String.fromCharCode(65 + i)}. ${opt}\n`;
                });
                txtContent += `\n[${uiStrings[currentLang].yourAns}] ${uAnsStr}\n`;
                txtContent += `[${uiStrings[currentLang].correctAns}] ${cAnsStr}\n\n`;
                txtContent += `[${uiStrings[currentLang].explanation}]\n${qExp}\n`;
                txtContent += `\n-----------------------------------------\n\n`;
            });

            const blob = new Blob([txtContent], { type: "text/plain;charset=utf-8" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = "wrong_questions.txt";
            a.click();
            URL.revokeObjectURL(url);
        }

        async function downloadWrongQuestionsPDF() {
            const wrongItems = Array.from(document.querySelectorAll('#wrong-questions-list > div'));
            if (wrongItems.length === 0) {
                showModal(uiStrings[currentLang].noWrongQuestions);
                return;
            }

            const pdfButton = document.getElementById('download-wrong-pdf-btn');
            const originalButtonHTML = pdfButton.innerHTML;
            let captureRoot = null;

            try {
                if (!window.html2canvas || !window.jspdf || !window.jspdf.jsPDF) {
                    throw new Error('PDF export libraries are unavailable.');
                }

                pdfButton.disabled = true;
                pdfButton.innerHTML = `<i class="fas fa-spinner fa-spin"></i> <span>${uiStrings[currentLang].preparingPDF}</span>`;

                if (document.fonts && document.fonts.ready) {
                    await document.fonts.ready;
                }

                const { jsPDF } = window.jspdf;
                const pdf = new jsPDF({
                    orientation: 'portrait',
                    unit: 'mm',
                    format: 'a4',
                    compress: true
                });

                const pageWidth = pdf.internal.pageSize.getWidth();
                const pageHeight = pdf.internal.pageSize.getHeight();
                const margin = 12;
                const imageWidth = pageWidth - (margin * 2);
                const availableHeight = pageHeight - (margin * 2);
                let isFirstPage = true;

                captureRoot = document.createElement('div');
                captureRoot.setAttribute('aria-hidden', 'true');
                captureRoot.style.cssText = 'position:fixed;left:-10000px;top:0;width:776px;background:#fff;pointer-events:none;';
                document.body.appendChild(captureRoot);

                for (const item of wrongItems) {
                    const capturePage = document.createElement('div');
                    capturePage.style.cssText = 'width:776px;padding:28px;background:#fff;box-sizing:border-box;';
                    capturePage.appendChild(item.cloneNode(true));
                    captureRoot.appendChild(capturePage);

                    const images = Array.from(capturePage.querySelectorAll('img'));
                    await Promise.all(images.map(img => {
                        if (img.complete) return Promise.resolve();
                        return new Promise(resolve => {
                            img.addEventListener('load', resolve, { once: true });
                            img.addEventListener('error', resolve, { once: true });
                        });
                    }));

                    const canvas = await window.html2canvas(capturePage, {
                        scale: 2,
                        useCORS: true,
                        backgroundColor: '#ffffff',
                        logging: false,
                        windowWidth: capturePage.scrollWidth,
                        windowHeight: capturePage.scrollHeight
                    });
                    captureRoot.removeChild(capturePage);

                    const pixelsPerMillimetre = canvas.width / imageWidth;
                    const maxSliceHeight = Math.max(1, Math.floor(availableHeight * pixelsPerMillimetre));

                    for (let sourceY = 0; sourceY < canvas.height; sourceY += maxSliceHeight) {
                        const sliceHeight = Math.min(maxSliceHeight, canvas.height - sourceY);
                        const sliceCanvas = document.createElement('canvas');
                        sliceCanvas.width = canvas.width;
                        sliceCanvas.height = sliceHeight;
                        const sliceContext = sliceCanvas.getContext('2d');
                        sliceContext.fillStyle = '#ffffff';
                        sliceContext.fillRect(0, 0, sliceCanvas.width, sliceCanvas.height);
                        sliceContext.drawImage(
                            canvas,
                            0, sourceY, canvas.width, sliceHeight,
                            0, 0, canvas.width, sliceHeight
                        );

                        if (!isFirstPage) pdf.addPage();
                        isFirstPage = false;

                        const renderedHeight = sliceHeight / pixelsPerMillimetre;
                        pdf.addImage(
                            sliceCanvas.toDataURL('image/jpeg', 0.94),
                            'JPEG',
                            margin,
                            margin,
                            imageWidth,
                            renderedHeight,
                            undefined,
                            'FAST'
                        );
                    }
                }

                pdf.save(currentLang === 'zh' ? '錯題本.pdf' : 'wrong_questions.pdf');
            } catch (error) {
                console.error(error);
                showModal(uiStrings[currentLang].pdfDownloadError);
            } finally {
                if (captureRoot && captureRoot.parentNode) {
                    captureRoot.parentNode.removeChild(captureRoot);
                }
                pdfButton.disabled = false;
                pdfButton.innerHTML = originalButtonHTML;
            }
        }

        // Back Button Logic
        document.getElementById('back-btn').addEventListener('click', () => {
            if (currentView === 'sections') {
                showSubtopicsView();
            } else if (currentView === 'range') {
                if (currentSectionId) {
                    showSectionsView(subtopicsData['acids'].find(s => s.id === currentSubtopicId));
                } else {
                    showSubtopicsView();
                }
            } else if (currentView === 'quiz' || currentView === 'result') {
                if (confirm(currentLang === 'zh' ? "確定要離開測驗嗎？進度將會遺失。" : "Are you sure you want to leave the quiz? Progress will be lost.")) {
                    showRangeView(currentRangeTargetId, currentRangeTitleZh, currentRangeTitleEn);
                }
            }
        });

        // Initialize App
        updateUI();
        showSubtopicsView();

    </script>
</body>
