        </section>

                <div id="options-container" class="space-y-3"></div>
                <div id="explanation-container" class="hidden"></div>
            </div>

        function showModal(msg) {
            document.getElementById('modal-msg').innerText = msg;
            document.getElementById('modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('modal').classList.add('hidden');
        }

        function toggleLanguage() {
            currentLang = currentLang === 'zh' ? 'en' : 'zh';
            document.getElementById('lang-toggle-text').innerText = currentLang === 'zh' ? 'English' : '中文';
            updateUI();
            
            // Re-render current view with updated language
            if (currentView === 'subtopics') {
                showSubtopicsView();
            } else if (currentView === 'sections') {
                showSectionsView(subtopicsData['main'].find(s => s.id === currentSubtopicId));
            } else if (currentView === 'range') {
                showRangeView(currentRangeTargetId, currentRangeTitleZh, currentRangeTitleEn);
            } else if (currentView === 'quiz') {
                document.getElementById('ui-title').innerText = currentLang === 'zh' ? currentRangeTitleZh : currentRangeTitleEn;
                updateQuestionSelector();
                renderQuestion();
            } else if (currentView === 'result') {
                document.getElementById('ui-title').innerText = currentLang === 'zh' ? currentRangeTitleZh : currentRangeTitleEn;
                showResults();
            }
        }

        document.getElementById('lang-toggle-btn').addEventListener('click', toggleLanguage);

        function updateUI() {
            const strings = uiStrings[currentLang];
            document.getElementById('ui-app-heading').innerText = strings.appTitle;
            document.getElementById('ui-select-chapter-label').innerText = strings.selectChapter;
            if (document.getElementById('ui-select-section-label')) {
                document.getElementById('ui-select-section-label').innerText = strings.selectSection;
            }
            document.getElementById('ui-question-label').innerText = strings.question;
            document.getElementById('ui-prev-text').innerText = strings.prev;
            document.getElementById('ui-next-text').innerText = strings.next;
            document.getElementById('ui-result-title').innerText = strings.resultTitle;
            document.getElementById('ui-final-score-label').innerText = strings.finalScoreLabel;
            document.getElementById('ui-download-wrong-text').innerText = strings.downloadWrong;
            document.getElementById('ui-download-wrong-pdf-text').innerText = strings.downloadWrongPDF;
            document.getElementById('ui-wrong-title').innerHTML = `<i class="fas fa-times-circle text-rose-500"></i> ${strings.wrongTitle}`;
        }

        function getQuestionCount(targetId) {
            return getAllQuestionsForTarget(targetId).length;
        }

        function showSubtopicsView() {
            currentView = 'subtopics';
            currentSectionId = null;

            document.getElementById('subtopic-view').classList.remove('hidden');
            document.getElementById('section-view').classList.add('hidden');
            document.getElementById('range-view').classList.add('hidden');
            document.getElementById('quiz-view').classList.add('hidden');
            document.getElementById('result-view').classList.add('hidden');
            document.getElementById('back-btn').classList.add('hidden');

            document.getElementById('ui-title').innerText = uiStrings[currentLang].appTitle;

            const container = document.getElementById('subtopics-container');
            container.innerHTML = '';

            subtopicsData['main'].forEach(sec => {
                const count = getQuestionCount(sec.id);
                const title = currentLang === 'zh' ? sec.titleZh : sec.titleEn;
                const countBadge = `<span class="bg-teal-50 text-teal-700 text-sm font-semibold px-3 py-1 rounded-full">${count} ${uiStrings[currentLang].qUnit}</span>`;

                const card = document.createElement('div');
                card.className = 'bg-white rounded-xl p-4 border border-slate-200 hover:border-teal-400 hover:shadow-md transition cursor-pointer flex items-center justify-between';
                card.onclick = () => {
                    currentSubtopicId = sec.id;
                    if (sectionsData[sec.id]) {
                        showSectionsView(sec);
                    } else {
                        showRangeView(sec.id, sec.titleZh, sec.titleEn);
                    }
                };
                card.innerHTML = `<div class="font-bold text-slate-700 text-base pr-4">${title}</div><div>${countBadge}</div>`;
                container.appendChild(card);
            });
        }

        function showSectionsView(subtopic) {
            currentView = 'sections';
            document.getElementById('subtopic-view').classList.add('hidden');
            document.getElementById('section-view').classList.remove('hidden');
            document.getElementById('range-view').classList.add('hidden');
            document.getElementById('quiz-view').classList.add('hidden');
            document.getElementById('result-view').classList.add('hidden');
            document.getElementById('back-btn').classList.remove('hidden');

            const title = currentLang === 'zh' ? subtopic.titleZh : subtopic.titleEn;
            document.getElementById('section-header-title').innerText = title;
            document.getElementById('ui-title').innerText = title;

            const container = document.getElementById('sections-container');
            container.innerHTML = '';

            const sections = sectionsData[subtopic.id] || [];
            sections.forEach(sec => {
                const count = getQuestionCount(sec.id);
                const secTitle = currentLang === 'zh' ? sec.titleZh : sec.titleEn;
                const countBadge = `<span class="bg-teal-50 text-teal-700 text-sm font-semibold px-3 py-1 rounded-full">${count} ${uiStrings[currentLang].qUnit}</span>`;

                const card = document.createElement('div');
                card.className = 'bg-white rounded-xl p-4 border border-slate-200 hover:border-teal-400 hover:shadow-md transition cursor-pointer flex items-center justify-between';
                card.onclick = () => {
                    currentSectionId = sec.id;
                    showRangeView(sec.id, sec.titleZh, sec.titleEn);
                };
                card.innerHTML = `<div class="font-bold text-slate-700 text-base pr-4">${secTitle}</div><div>${countBadge}</div>`;
                container.appendChild(card);
            });
        }

        function showRangeView(targetId, titleZh, titleEn) {
            currentView = 'range';
            currentRangeTargetId = targetId;
            currentRangeTitleZh = titleZh;
            currentRangeTitleEn = titleEn;

            document.getElementById('subtopic-view').classList.add('hidden');
            document.getElementById('section-view').classList.add('hidden');
            document.getElementById('quiz-view').classList.add('hidden');
            document.getElementById('result-view').classList.add('hidden');
            document.getElementById('range-view').classList.remove('hidden');
            document.getElementById('back-btn').classList.remove('hidden');

            const title = currentLang === 'zh' ? titleZh : titleEn;
            document.getElementById('range-header-title').innerText = title;
            document.getElementById('ui-title').innerText = title;

            renderRanges(targetId);
        }

        function renderRanges(targetId) {
            const container = document.getElementById('ranges-container');
            container.innerHTML = '';
            
            const totalQs = getQuestionCount(targetId);
            if (totalQs === 0) {
                container.innerHTML = `<div class="col-span-full text-center py-8 text-slate-400 font-medium">${uiStrings[currentLang].noQuestions}</div>`;
                return;
            }

            const rangeSize = 10;
            const numRanges = Math.ceil(totalQs / rangeSize);

            // All questions option
            const allCard = document.createElement('div');
            allCard.className = 'bg-white rounded-xl p-4 border border-teal-200 cursor-pointer flex flex-col items-center justify-center hover:bg-teal-50 hover:border-teal-400 transition shadow-sm';
            allCard.onclick = () => startQuiz(targetId, 0, totalQs);
            allCard.innerHTML = `
                <i class="fas fa-layer-group text-2xl text-teal-500 mb-2"></i>
                <div class="font-bold text-teal-700 text-center">${uiStrings[currentLang].allQuestions}</div>
                <div class="text-xs text-teal-600 mt-1">${totalQs} ${uiStrings[currentLang].qUnit}</div>
            `;
            container.appendChild(allCard);

            // 10-question ranges
            for (let i = 0; i < numRanges; i++) {
                const start = i * rangeSize + 1;
                const end = Math.min((i + 1) * rangeSize, totalQs);
                const card = document.createElement('div');
                card.className = 'bg-white rounded-xl p-4 border border-slate-200 cursor-pointer flex flex-col items-center justify-center hover:bg-slate-50 hover:border-slate-300 transition shadow-sm';
                card.onclick = () => startQuiz(targetId, start - 1, end);
                card.innerHTML = `
                    <i class="fas fa-list-ol text-2xl text-slate-400 mb-2"></i>
                    <div class="font-bold text-slate-700">Q${start} - Q${end}</div>
                    <div class="text-xs text-slate-500 mt-1">${end - start + 1} ${uiStrings[currentLang].qUnit}</div>
                `;
                container.appendChild(card);
            }

            // Custom range
            const customCard = document.createElement('div');
            customCard.className = 'col-span-full bg-white rounded-xl p-5 border border-slate-200 mt-2 shadow-sm';
            customCard.innerHTML = `
                <div class="font-bold text-slate-700 mb-3 flex items-center gap-2">
                    <i class="fas fa-sliders-h text-indigo-400"></i> <span id="ui-custom-range-label">${uiStrings[currentLang].customRange}</span> (1 - ${totalQs})
                </div>
                <div class="flex items-center gap-3">
                    <input type="number" id="custom-start" min="1" max="${totalQs}" placeholder="1" class="w-20 px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500">
                    <span class="text-slate-500">-</span>
                    <input type="number" id="custom-end" min="1" max="${totalQs}" placeholder="${totalQs}" class="w-20 px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500">
                    <button id="custom-range-btn" onclick="startCustomQuiz('${targetId}', ${totalQs})" class="ml-auto px-4 py-2 bg-indigo-500 text-white rounded-lg font-medium hover:bg-indigo-600 transition shadow-sm">${uiStrings[currentLang].startCustom}</button>
                </div>
            `;
            container.appendChild(customCard);
        }

        function startCustomQuiz(targetId, totalQs) {
            let start = parseInt(document.getElementById('custom-start').value);
            let end = parseInt(document.getElementById('custom-end').value);
            
            if (isNaN(start)) start = 1;
            if (isNaN(end)) end = totalQs;

            if (start < 1 || end > totalQs || start > end) {
                showModal(uiStrings[currentLang].invalidRange);
                return;
            }
            startQuiz(targetId, start - 1, end);
        }

        function getAllQuestionsForTarget(targetId) {
            if (questionsData[targetId]) return questionsData[targetId];
            if (sectionsData[targetId]) {
                let qs = [];
                sectionsData[targetId].forEach(sec => {
                    if (questionsData[sec.id]) qs = qs.concat(questionsData[sec.id]);
                });
                return qs;
            }
            return [];
        }

        function startQuiz(targetId, startIndex, endIndex) {
            const allQs = getAllQuestionsForTarget(targetId);
            currentQuestions = allQs.slice(startIndex, endIndex);
            currentGlobalOffset = startIndex;
            
            if (currentQuestions.length === 0) {
                showModal(uiStrings[currentLang].noQuestions);
                return;
            }

            userAnswers = new Array(currentQuestions.length).fill(null);
            currentQuestionIndex = 0;
            score = 0;

            currentView = 'quiz';
            document.getElementById('range-view').classList.add('hidden');
            document.getElementById('quiz-view').classList.remove('hidden');
            document.getElementById('result-view').classList.add('hidden');
            document.getElementById('question-container').classList.remove('hidden');
            document.getElementById('quiz-controls').classList.remove('hidden');
            
            const title = currentLang === 'zh' ? currentRangeTitleZh : currentRangeTitleEn;
            document.getElementById('ui-title').innerText = title;

            updateQuestionSelector();
            renderQuestion();
        }

        function updateQuestionSelector() {
            const selector = document.getElementById('question-selector');
            selector.innerHTML = '';
            for (let i = 0; i < currentQuestions.length; i++) {
                const opt = document.createElement('option');
                opt.value = i;
                opt.innerText = (currentGlobalOffset + i + 1);
                selector.appendChild(opt);
            }
            document.getElementById('question-total-text').innerText = `/ ${currentGlobalOffset + currentQuestions.length}`;
        }

        function jumpToQuestion(index) {
            currentQuestionIndex = parseInt(index);
            renderQuestion();
        }

        function renderQuestion() {
            const q = currentQuestions[currentQuestionIndex];
            const qText = currentLang === 'zh' ? q.questionZh : q.questionEn;
            const options = currentLang === 'zh' ? q.optionsZh : q.optionsEn;

            document.getElementById('question-selector').value = currentQuestionIndex;
            document.getElementById('question-text').innerText = qText;

            const imgContainer = document.getElementById('question-image-container');
            if (q.image) {
                imgContainer.innerHTML = `<img src="${q.image}" alt="Question Image" class="max-w-full h-auto rounded-lg border border-slate-200 shadow-sm max-h-64 object-contain">`;
                imgContainer.classList.remove('hidden');
            } else {
                imgContainer.innerHTML = '';
                imgContainer.classList.add('hidden');
            }

            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';

            const explanationContainer = document.getElementById('explanation-container');
            explanationContainer.innerHTML = '';
            explanationContainer.classList.add('hidden');

            const hasAnswered = userAnswers[currentQuestionIndex] !== null;
            const userAnswer = userAnswers[currentQuestionIndex];

            options.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn w-full text-left p-4 rounded-xl border-2 border-slate-200 hover:border-teal-400 hover:bg-teal-50 font-medium text-slate-700 flex items-start gap-3 transition';
                
                const letter = String.fromCharCode(65 + index);
                let btnClass = '';
                let iconHtml = `<span class="flex-shrink-0 w-6 h-6 rounded-full bg-slate-100 text-slate-600 flex items-center justify-center text-sm font-semibold">${letter}</span>`;

                if (hasAnswered) {
                    btn.disabled = true;
                    btn.classList.remove('hover:border-teal-400', 'hover:bg-teal-50', 'cursor-pointer');
                    
                    if (index === q.answer) {
                        btnClass = 'correct';
                        iconHtml = `<span class="flex-shrink-0 w-6 h-6 rounded-full bg-green-100 text-green-600 flex items-center justify-center"><i class="fas fa-check"></i></span>`;
                    } else if (index === userAnswer) {
                        btnClass = 'wrong';
                        iconHtml = `<span class="flex-shrink-0 w-6 h-6 rounded-full bg-red-100 text-red-600 flex items-center justify-center"><i class="fas fa-times"></i></span>`;
                    } else {
                        btn.classList.add('opacity-50');
                    }
                } else {
                    btn.onclick = () => selectOption(index);
                }

                if (btnClass) btn.classList.add(btnClass);
                
                btn.innerHTML = `${iconHtml} <span>${opt}</span>`;
                optionsContainer.appendChild(btn);
            });

            // Show explanation if answered incorrectly
            if (hasAnswered && userAnswer !== q.answer) {
                const expText = currentLang === 'zh' ? q.explanationZh : q.explanationEn;
                const expTitle = uiStrings[currentLang].explanation;
                explanationContainer.innerHTML = `
                    <div class="p-4 bg-sky-50 border border-sky-100 rounded-xl text-sky-800 text-sm mt-4">
                        <div class="font-bold flex items-center gap-2 mb-1"><i class="fas fa-info-circle"></i> ${expTitle}</div>
                        <div class="whitespace-pre-line leading-relaxed">${expText}</div>
                    </div>
                `;
                explanationContainer.classList.remove('hidden');
            }

            document.getElementById('prev-btn').disabled = currentQuestionIndex === 0;
            
            const nextBtn = document.getElementById('next-btn');
            if (currentQuestionIndex === currentQuestions.length - 1) {
                nextBtn.innerHTML = `<span id="ui-next-text">${uiStrings[currentLang].finish}</span>`;
                nextBtn.classList.remove('bg-teal-500', 'hover:bg-teal-600');
                nextBtn.classList.add('bg-indigo-500', 'hover:bg-indigo-600');
            } else {
                nextBtn.innerHTML = `<span id="ui-next-text">${uiStrings[currentLang].next}</span> <i class="fas fa-chevron-right ml-1"></i>`;
                nextBtn.classList.remove('bg-indigo-500', 'hover:bg-indigo-600');
                nextBtn.classList.add('bg-teal-500', 'hover:bg-teal-600');
            }
        }

        function selectOption(index) {
            userAnswers[currentQuestionIndex] = index;
            if (index === currentQuestions[currentQuestionIndex].answer) {
                score++;
            }
            renderQuestion();
        }

        function showResults() {
            document.getElementById('question-container').classList.add('hidden');
            document.getElementById('quiz-controls').classList.add('hidden');
            document.getElementById('result-view').classList.remove('hidden');

            document.getElementById('final-score').innerText = `${score} / ${currentQuestions.length}`;

            const wrongList = document.getElementById('wrong-questions-list');
            wrongList.innerHTML = '';
            
            let hasWrong = false;

            currentQuestions.forEach((q, index) => {
                if (userAnswers[index] !== q.answer) {
                    hasWrong = true;
                    const qText = currentLang === 'zh' ? q.questionZh : q.questionEn;
                    const options = currentLang === 'zh' ? q.optionsZh : q.optionsEn;
                    const expText = currentLang === 'zh' ? q.explanationZh : q.explanationEn;
                    const expTitle = uiStrings[currentLang].explanation;
                    
                    const userAnswerText = userAnswers[index] !== null ? options[userAnswers[index]] : uiStrings[currentLang].unanswered;
                    const correctAnswerText = options[q.answer];

                    const item = document.createElement('div');
                    item.className = 'bg-slate-50 p-5 rounded-xl border border-slate-200';
                    
                    let imgHtml = '';
                    if (q.image) {
                        imgHtml = `<div class="my-3"><img src="${q.image}" class="max-h-40 rounded border border-slate-300"></div>`;
                    }

                    let optionsHtml = '<div class="mt-3 mb-4 space-y-2">';
                    options.forEach((opt, i) => {
                        const letter = String.fromCharCode(65 + i);
                        let optClass = "p-3 rounded-lg border text-sm flex items-start gap-3 ";
                        let iconHtml = `<span class="flex-shrink-0 w-5 h-5 rounded-full bg-slate-200 text-slate-700 flex items-center justify-center text-xs font-semibold">${letter}</span>`;
                        
                        if (i === q.answer) {
                            optClass += "bg-green-50 border-green-200 text-green-800 font-medium";
                            iconHtml = `<span class="flex-shrink-0 w-5 h-5 rounded-full bg-green-200 text-green-700 flex items-center justify-center text-xs"><i class="fas fa-check"></i></span>`;
                        } else if (i === userAnswers[index]) {
                            optClass += "bg-red-50 border-red-200 text-red-800";
                            iconHtml = `<span class="flex-shrink-0 w-5 h-5 rounded-full bg-red-200 text-red-700 flex items-center justify-center text-xs"><i class="fas fa-times"></i></span>`;
                        } else {
                            optClass += "bg-white border-slate-200 text-slate-600";
                        }
                        
                        optionsHtml += `<div class="${optClass}">${iconHtml} <span>${opt}</span></div>`;
                    });
                    optionsHtml += '</div>';

                    let userAnsLabel = uiStrings[currentLang].yourAns;
                    let correctAnsLabel = uiStrings[currentLang].correctAns;

                    item.innerHTML = `
                        <p class="font-bold text-slate-800 mb-2 text-lg whitespace-pre-line">Q${currentGlobalOffset + index + 1}. ${qText}</p>
                        ${imgHtml}
                        ${optionsHtml}
                        <p class="text-rose-600 text-sm mb-1 font-medium"><i class="fas fa-times mr-1"></i> ${userAnsLabel}: ${userAnswerText}</p>
                        <p class="text-emerald-600 text-sm mb-3 font-medium"><i class="fas fa-check mr-1"></i> ${correctAnsLabel}: ${correctAnswerText}</p>
                        <div class="p-3 bg-sky-50 border border-sky-100 rounded-lg text-sky-800 text-sm">
                            <div class="font-bold flex items-center gap-2 mb-1"><i class="fas fa-info-circle"></i> ${expTitle}</div>
                            <div class="whitespace-pre-line leading-relaxed">${expText}</div>
                        </div>
                    `;
                    wrongList.appendChild(item);
                }
            });

            if (hasWrong) {
                document.getElementById('wrong-questions-section').classList.remove('hidden');
                document.getElementById('download-wrong-buttons').classList.remove('hidden');
            } else {
                document.getElementById('wrong-questions-section').classList.add('hidden');
                document.getElementById('download-wrong-buttons').classList.add('hidden');
            }
        }

        function downloadWrongQuestionsTXT() {
            let content = "";
            let hasWrong = false;
            
            content += "錯題記錄 (Incorrect Questions Record)\n";
            content += "========================================\n\n";

            currentQuestions.forEach((q, index) => {
                if (userAnswers[index] !== q.answer) {
                    hasWrong = true;
                    const qText = currentLang === 'zh' ? q.questionZh : q.questionEn;
                    const options = currentLang === 'zh' ? q.optionsZh : q.optionsEn;
                    const expText = currentLang === 'zh' ? q.explanationZh : q.explanationEn;
                    
                    const userAnswerText = userAnswers[index] !== null ? options[userAnswers[index]] : (currentLang === 'zh' ? "未作答" : "Unanswered");
                    const correctAnswerText = options[q.answer];

                    content += `Q${currentGlobalOffset + index + 1}. ${qText}\n`;
                    options.forEach((opt, i) => {
                        content += `${String.fromCharCode(65 + i)}. ${opt}\n`;
                    });
                    content += `\n你的答案 (Your Answer): ${userAnswerText}\n`;
                    content += `正確答案 (Correct Answer): ${correctAnswerText}\n`;
                    content += `解釋 (Explanation):\n${expText}\n`;
                    content += "----------------------------------------\n\n";
                }
            });

            if (!hasWrong) {
                showModal(uiStrings[currentLang].noWrongQuestions);
                return;
            }

            const blob = new Blob([content], { type: "text/plain;charset=utf-8" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = "wrong_questions.txt";
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        async function downloadWrongQuestionsPDF() {
            const wrongItems = Array.from(document.querySelectorAll('#wrong-questions-list > div'));
            if (wrongItems.length === 0) {
                showModal(uiStrings[currentLang].noWrongQuestions);
                return;
            }

            const pdfButton = document.getElementById('download-wrong-pdf-btn');
            const originalButtonHTML = pdfButton.innerHTML;
            let captureRoot = null;

            try {
                if (!window.html2canvas || !window.jspdf || !window.jspdf.jsPDF) {
                    throw new Error('PDF export libraries are unavailable.');
                }

                pdfButton.disabled = true;
                pdfButton.innerHTML = `<i class="fas fa-spinner fa-spin"></i> <span>${uiStrings[currentLang].preparingPDF}</span>`;

                if (document.fonts && document.fonts.ready) {
                    await document.fonts.ready;
                }

                const { jsPDF } = window.jspdf;
                const pdf = new jsPDF({
                    orientation: 'portrait',
                    unit: 'mm',
                    format: 'a4',
                    compress: true
                });

                const pageWidth = pdf.internal.pageSize.getWidth();
                const pageHeight = pdf.internal.pageSize.getHeight();
                const margin = 12;
                const imageWidth = pageWidth - (margin * 2);
                const availableHeight = pageHeight - (margin * 2);
                let isFirstPage = true;

                captureRoot = document.createElement('div');
                captureRoot.setAttribute('aria-hidden', 'true');
                captureRoot.style.cssText = 'position:fixed;left:-10000px;top:0;width:776px;background:#fff;pointer-events:none;';
                document.body.appendChild(captureRoot);

                for (const item of wrongItems) {
                    const capturePage = document.createElement('div');
                    capturePage.style.cssText = 'width:776px;padding:28px;background:#fff;box-sizing:border-box;';
                    capturePage.appendChild(item.cloneNode(true));
                    captureRoot.appendChild(capturePage);

                    const images = Array.from(capturePage.querySelectorAll('img'));
                    await Promise.all(images.map(img => {
                        if (img.complete) return Promise.resolve();
                        return new Promise(resolve => {
                            img.addEventListener('load', resolve, { once: true });
                            img.addEventListener('error', resolve, { once: true });
                        });
                    }));

                    const canvas = await window.html2canvas(capturePage, {
                        scale: 2,
                        useCORS: true,
                        backgroundColor: '#ffffff',
                        logging: false,
                        windowWidth: capturePage.scrollWidth,
                        windowHeight: capturePage.scrollHeight
                    });
                    captureRoot.removeChild(capturePage);

                    const pixelsPerMillimetre = canvas.width / imageWidth;
                    const maxSliceHeight = Math.max(1, Math.floor(availableHeight * pixelsPerMillimetre));

                    for (let sourceY = 0; sourceY < canvas.height; sourceY += maxSliceHeight) {
                        const sliceHeight = Math.min(maxSliceHeight, canvas.height - sourceY);
                        const sliceCanvas = document.createElement('canvas');
                        sliceCanvas.width = canvas.width;
                        sliceCanvas.height = sliceHeight;
                        const sliceContext = sliceCanvas.getContext('2d');
                        sliceContext.fillStyle = '#ffffff';
                        sliceContext.fillRect(0, 0, sliceCanvas.width, sliceCanvas.height);
                        sliceContext.drawImage(
                            canvas,
                            0, sourceY, canvas.width, sliceHeight,
                            0, 0, canvas.width, sliceHeight
                        );

                        if (!isFirstPage) pdf.addPage();
                        isFirstPage = false;

                        const renderedHeight = sliceHeight / pixelsPerMillimetre;
                        pdf.addImage(
                            sliceCanvas.toDataURL('image/jpeg', 0.94),
                            'JPEG',
                            margin,
                            margin,
                            imageWidth,
                            renderedHeight,
                            undefined,
                            'FAST'
                        );
                    }
                }

                pdf.save(currentLang === 'zh' ? '錯題本.pdf' : 'wrong_questions.pdf');
            } catch (error) {
                console.error(error);
                showModal(uiStrings[currentLang].pdfDownloadError);
            } finally {
                if (captureRoot && captureRoot.parentNode) {
                    captureRoot.parentNode.removeChild(captureRoot);
                }
                pdfButton.disabled = false;
                pdfButton.innerHTML = originalButtonHTML;
            }
        }

        function goBack() {
            if (currentView === 'quiz') {
                showRangeView(currentRangeTargetId, currentRangeTitleZh, currentRangeTitleEn);
            } else if (currentView === 'range') {
                if (currentSectionId) {
                    showSectionsView(subtopicsData['main'].find(s => s.id === currentSubtopicId));
                } else {
                    showSubtopicsView();
                }
            } else if (currentView === 'sections') {
                showSubtopicsView();
            }
        }

        document.getElementById('back-btn').addEventListener('click', goBack);

        document.getElementById('prev-btn').addEventListener('click', () => {
            if (currentQuestionIndex > 0) {
                currentQuestionIndex--;
                renderQuestion();
            }
        });

        document.getElementById('next-btn').addEventListener('click', () => {
            if (currentQuestionIndex < currentQuestions.length - 1) {
                currentQuestionIndex++;
                renderQuestion();
            } else {
                let unanswered = userAnswers.filter(a => a === null).length;
                if (unanswered > 0) {
                    let msg = uiStrings[currentLang].confirmFinish.replace('{unanswered}', unanswered);
                    if (confirm(msg)) {
                        showResults();
                    }
                } else {
                    showResults();
                }
            }
        });

        // Initialize App
        updateUI();
        showSubtopicsView();
    </script>
</body>
