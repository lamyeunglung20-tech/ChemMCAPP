        function showModal(msg) {
            document.getElementById('modal-msg').innerText = msg;
            document.getElementById('modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('modal').classList.add('hidden');
        }

        function toggleLanguage() {
            currentLang = currentLang === 'zh' ? 'en' : 'zh';
            document.getElementById('lang-toggle-text').innerText = currentLang === 'zh' ? 'English' : '中文';
            
            updateUI();
            
            if (currentView === 'subtopics') {
                showSubtopicsView();
            } else if (currentView === 'sections') {
                showSectionsView(subtopicsData['main'].find(s => s.id === currentSubtopicId));
            } else if (currentView === 'range') {
                showRangeView(currentRangeTargetId, currentRangeTitleZh, currentRangeTitleEn);
            } else if (currentView === 'quiz') {
                updateQuestionSelector();
                renderQuestion(); 
            } else if (currentView === 'result') {
                showResults();
            }
        }

        document.getElementById('lang-toggle-btn').addEventListener('click', toggleLanguage);

        function updateUI() {
            const strings = uiStrings[currentLang];
            
            document.title = strings.appTitle;
            
            document.getElementById('ui-app-heading').innerText = strings.appTitle;
            document.getElementById('ui-select-chapter-label').innerText = strings.selectChapter;
            if (document.getElementById('ui-select-section-label')) {
                document.getElementById('ui-select-section-label').innerText = strings.selectSection;
            }
            document.getElementById('ui-question-label').innerText = strings.question;
            
            const prevTextEl = document.getElementById('ui-prev-text');
            if(prevTextEl) prevTextEl.innerText = strings.prev;
            
            const nextTextEl = document.getElementById('ui-next-text');
            if(nextTextEl) {
                if (currentView === 'quiz' && currentQuestions.length > 0 && currentQuestionIndex === currentQuestions.length - 1) {
                    nextTextEl.innerText = strings.finish;
                } else {
                    nextTextEl.innerText = strings.next;
                }
            }

            document.getElementById('ui-result-title').innerText = strings.resultTitle;
            document.getElementById('ui-final-score-label').innerText = strings.finalScoreLabel;
            document.getElementById('ui-download-wrong-text').innerText = strings.downloadWrong;
            document.getElementById('ui-download-wrong-pdf-text').innerText = strings.downloadWrongPDF;
            document.getElementById('ui-wrong-title').innerHTML = `<i class="fas fa-times-circle text-rose-500"></i> ${strings.wrongTitle}`;
            
            const modalBtn = document.getElementById('ui-modal-btn');
            if(modalBtn) modalBtn.innerText = strings.okBtn;

            const uiTitleEl = document.getElementById('ui-title');
            if (currentView === 'subtopics') {
                uiTitleEl.innerText = strings.appTitle;
            } else if (currentView === 'sections' && currentSubtopicId) {
                const subtopic = subtopicsData['main'].find(s => s.id === currentSubtopicId);
                if(subtopic) uiTitleEl.innerText = currentLang === 'zh' ? subtopic.titleZh : subtopic.titleEn;
            } else if (currentView === 'range' || currentView === 'quiz' || currentView === 'result') {
                uiTitleEl.innerText = currentLang === 'zh' ? currentRangeTitleZh : currentRangeTitleEn;
            }
            
            if (document.getElementById('section-header-title') && currentSubtopicId && currentView === 'sections') {
                const subtopic = subtopicsData['main'].find(s => s.id === currentSubtopicId);
                if(subtopic) document.getElementById('section-header-title').innerText = currentLang === 'zh' ? subtopic.titleZh : subtopic.titleEn;
            }
            if (document.getElementById('range-header-title') && currentView === 'range') {
                document.getElementById('range-header-title').innerText = currentLang === 'zh' ? currentRangeTitleZh : currentRangeTitleEn;
            }
        }

        function hideAllViews() {
            document.getElementById('subtopic-view').classList.add('hidden');
            document.getElementById('section-view').classList.add('hidden');
            document.getElementById('range-view').classList.add('hidden');
            document.getElementById('quiz-view').classList.add('hidden');
            document.getElementById('result-view').classList.add('hidden');
            document.getElementById('back-btn').classList.remove('hidden');
        }

        // --- SUBTOPIC VIEW ---
        function showSubtopicsView() {
            hideAllViews();
            currentView = 'subtopics';
            document.getElementById('subtopic-view').classList.remove('hidden');
            document.getElementById('back-btn').classList.add('hidden');
            
            const uiTitleEl = document.getElementById('ui-title');
            uiTitleEl.innerText = uiStrings[currentLang].appTitle;

            const container = document.getElementById('subtopics-container');
            container.innerHTML = '';
            
            subtopicsData['main'].forEach(subtopic => {
                const btn = document.createElement('button');
                btn.className = "w-full text-left bg-white p-5 rounded-2xl shadow-sm border border-slate-200 hover:border-teal-400 hover:shadow-md transition group flex items-center justify-between";
                
                const title = currentLang === 'zh' ? subtopic.titleZh : subtopic.titleEn;
                const hasSections = !!sectionsData[subtopic.id];
                
                let qCount = 0;
                if (hasSections) {
                    sectionsData[subtopic.id].forEach(sec => {
                        if(questionsData[sec.id]) qCount += questionsData[sec.id].length;
                    });
                } else if (questionsData[subtopic.id]) {
                    qCount = questionsData[subtopic.id].length;
                }

                btn.innerHTML = `
                    <div>
                        <h3 class="font-bold text-slate-800 text-lg group-hover:text-teal-600 transition-colors">${title}</h3>
                        <p class="text-sm text-slate-500 mt-1"><i class="fas fa-list-ul mr-1"></i> ${qCount} ${uiStrings[currentLang].qUnit}</p>
                    </div>
                    <i class="fas fa-chevron-right text-slate-300 group-hover:text-teal-500 transition-colors"></i>
                `;
                
                btn.onclick = () => {
                    currentSubtopicId = subtopic.id;
                    if (hasSections) {
                        showSectionsView(subtopic);
                    } else {
                        showRangeView(subtopic.id, subtopic.titleZh, subtopic.titleEn);
                    }
                };
                container.appendChild(btn);
            });
        }

        // --- SECTIONS VIEW ---
        function showSectionsView(subtopic) {
            hideAllViews();
            currentView = 'sections';
            document.getElementById('section-view').classList.remove('hidden');
            
            const titleZh = subtopic.titleZh;
            const titleEn = subtopic.titleEn;
            document.getElementById('section-header-title').innerText = currentLang === 'zh' ? titleZh : titleEn;
            document.getElementById('ui-title').innerText = currentLang === 'zh' ? titleZh : titleEn;
            
            document.getElementById('back-btn').onclick = showSubtopicsView;

            const container = document.getElementById('sections-container');
            container.innerHTML = '';

            const sections = sectionsData[subtopic.id];
            sections.forEach(sec => {
                const btn = document.createElement('button');
                btn.className = "w-full text-left bg-white p-4 rounded-xl shadow-sm border border-slate-200 hover:border-teal-400 hover:shadow-md transition group flex items-center justify-between";
                
                const sTitle = currentLang === 'zh' ? sec.titleZh : sec.titleEn;
                const qCount = questionsData[sec.id] ? questionsData[sec.id].length : 0;
                
                btn.innerHTML = `
                    <div>
                        <h3 class="font-bold text-slate-800 group-hover:text-teal-600 transition-colors">${sTitle}</h3>
                        <p class="text-sm text-slate-500 mt-1"><i class="fas fa-tasks mr-1"></i> ${qCount} ${uiStrings[currentLang].qUnit}</p>
                    </div>
                    <i class="fas fa-chevron-right text-slate-300 group-hover:text-teal-500 transition-colors"></i>
                `;
                
                btn.onclick = () => {
                    currentSectionId = sec.id;
                    showRangeView(sec.id, sec.titleZh, sec.titleEn);
                };
                container.appendChild(btn);
            });
        }

        // --- RANGE VIEW ---
        function showRangeView(targetId, titleZh, titleEn) {
            hideAllViews();
            currentView = 'range';
            currentRangeTargetId = targetId;
            currentRangeTitleZh = titleZh;
            currentRangeTitleEn = titleEn;
            
            document.getElementById('range-view').classList.remove('hidden');
            document.getElementById('range-header-title').innerText = currentLang === 'zh' ? titleZh : titleEn;
            document.getElementById('ui-title').innerText = currentLang === 'zh' ? titleZh : titleEn;

            document.getElementById('back-btn').onclick = () => {
                if (sectionsData[currentSubtopicId]) {
                    showSectionsView(subtopicsData['main'].find(s => s.id === currentSubtopicId));
                } else {
                    showSubtopicsView();
                }
            };

            const questions = questionsData[targetId] || [];
            const totalQs = questions.length;
            const container = document.getElementById('ranges-container');
            container.innerHTML = '';

            if (totalQs === 0) {
                container.innerHTML = `<p class="col-span-full text-slate-500 text-center py-6">${uiStrings[currentLang].noQuestions}</p>`;
                return;
            }

            const rangeSize = 10;
            const numRanges = Math.ceil(totalQs / rangeSize);

            // "All Questions" button
            const allBtn = document.createElement('button');
            allBtn.className = "bg-teal-50 hover:bg-teal-100 border border-teal-200 text-teal-700 font-bold p-4 rounded-xl text-center transition flex flex-col items-center justify-center gap-1 shadow-sm";
            allBtn.innerHTML = `<i class="fas fa-list-ol text-xl mb-1"></i><span>${uiStrings[currentLang].allQuestions}</span><span class="text-xs font-normal opacity-80">(1 - ${totalQs})</span>`;
            allBtn.onclick = () => startQuiz(questions, 1, totalQs);
            container.appendChild(allBtn);

            // Specific ranges
            for (let i = 0; i < numRanges; i++) {
                const start = i * rangeSize + 1;
                const end = Math.min((i + 1) * rangeSize, totalQs);
                const rBtn = document.createElement('button');
                rBtn.className = "bg-white hover:bg-slate-50 border border-slate-200 text-slate-700 font-bold p-4 rounded-xl text-center transition shadow-sm hover:border-teal-300";
                rBtn.innerHTML = `Q${start} - Q${end}`;
                rBtn.onclick = () => startQuiz(questions, start, end);
                container.appendChild(rBtn);
            }

            // Custom Range Selection
            const customDiv = document.createElement('div');
            customDiv.className = "col-span-full bg-white p-5 rounded-xl border border-slate-200 shadow-sm mt-2";
            customDiv.innerHTML = `
                <p class="font-bold text-slate-700 mb-3"><i class="fas fa-sliders-h mr-2 text-teal-500"></i>${uiStrings[currentLang].customRange} (1 - ${totalQs}):</p>
                <div class="flex items-center gap-3">
                    <input type="number" id="custom-start" min="1" max="${totalQs}" placeholder="1" class="w-20 px-3 py-2 bg-slate-50 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-teal-500 text-center font-semibold">
                    <span class="text-slate-400 font-bold">-</span>
                    <input type="number" id="custom-end" min="1" max="${totalQs}" placeholder="${totalQs}" class="w-20 px-3 py-2 bg-slate-50 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-teal-500 text-center font-semibold">
                    <button id="custom-start-btn" class="ml-auto px-4 py-2 bg-teal-500 hover:bg-teal-600 text-white font-bold rounded-lg transition shadow-sm">${uiStrings[currentLang].startCustom}</button>
                </div>
            `;
            container.appendChild(customDiv);

            document.getElementById('custom-start-btn').onclick = () => {
                let s = parseInt(document.getElementById('custom-start').value);
                let e = parseInt(document.getElementById('custom-end').value);
                if (isNaN(s)) s = 1;
                if (isNaN(e)) e = totalQs;
                if (s >= 1 && e <= totalQs && s <= e) {
                    startQuiz(questions, s, e);
                } else {
                    showModal(uiStrings[currentLang].invalidRange);
                }
            };
        }

        // --- QUIZ VIEW ---
        function startQuiz(questions, startIdx, endIdx) {
            currentQuestions = questions.slice(startIdx - 1, endIdx);
            currentGlobalOffset = startIdx - 1;
            userAnswers = new Array(currentQuestions.length).fill(null);
            currentQuestionIndex = 0;

            hideAllViews();
            currentView = 'quiz';
            document.getElementById('quiz-view').classList.remove('hidden');
            
            document.getElementById('back-btn').onclick = () => {
                showRangeView(currentRangeTargetId, currentRangeTitleZh, currentRangeTitleEn);
            };

            updateQuestionSelector();
            renderQuestion();
        }

        function updateQuestionSelector() {
            const selector = document.getElementById('question-selector');
            selector.innerHTML = '';
            currentQuestions.forEach((_, index) => {
                const opt = document.createElement('option');
                opt.value = index;
                const globalNum = currentGlobalOffset + index + 1;
                opt.text = `${globalNum}`;
                
                // Add indicator if answered
                if (userAnswers[index] !== null) {
                    opt.text += ' ✓';
                }
                
                selector.appendChild(opt);
            });
            selector.value = currentQuestionIndex;
            
            document.getElementById('question-total-text').innerText = `/ ${currentGlobalOffset + currentQuestions.length}`;
        }

        function renderQuestion() {
            const q = currentQuestions[currentQuestionIndex];
            const isZh = currentLang === 'zh';
            
            document.getElementById('question-selector').value = currentQuestionIndex;

            const globalQNum = currentGlobalOffset + currentQuestionIndex + 1;
            document.getElementById('question-text').innerHTML = `<span class="text-teal-600 mr-2">${globalQNum}.</span> ${isZh ? q.questionZh : q.questionEn}`;
            
            const imgContainer = document.getElementById('question-image-container');
            if (q.image) {
                imgContainer.innerHTML = `<img src="${q.image}" class="max-w-full h-auto rounded" alt="Question Image">`;
                imgContainer.classList.remove('hidden');
            } else {
                imgContainer.innerHTML = '';
                imgContainer.classList.add('hidden');
            }

            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';
            
            const options = isZh ? q.optionsZh : q.optionsEn;
            const letters = ['A', 'B', 'C', 'D'];
            
            options.forEach((optText, index) => {
                const btn = document.createElement('button');
                btn.className = "option-btn w-full text-left p-4 rounded-xl border-2 border-slate-200 bg-white hover:border-teal-400 hover:bg-slate-50 transition font-medium text-slate-700 flex gap-3";
                btn.innerHTML = `<span class="font-bold text-slate-400 w-6 shrink-0">${letters[index]}.</span> <span>${optText}</span>`;
                
                if (userAnswers[currentQuestionIndex] !== null) {
                    btn.disabled = true;
                    btn.classList.remove('hover:border-teal-400', 'hover:bg-slate-50', 'cursor-pointer');
                    
                    if (index === q.answer) {
                        btn.classList.add('correct');
                        btn.innerHTML += `<i class="fas fa-check-circle ml-auto text-xl"></i>`;
                    } else if (index === userAnswers[currentQuestionIndex]) {
                        btn.classList.add('wrong');
                        btn.innerHTML += `<i class="fas fa-times-circle ml-auto text-xl"></i>`;
                    } else {
                        btn.classList.add('opacity-50');
                    }
                } else {
                    btn.onclick = () => selectAnswer(index);
                }
                optionsContainer.appendChild(btn);
            });

            const expContainer = document.getElementById('explanation-container');
            if (userAnswers[currentQuestionIndex] !== null) {
                expContainer.innerHTML = `
                    <div class="mt-5 p-4 bg-teal-50 border border-teal-100 rounded-xl">
                        <div class="font-bold text-teal-800 mb-1 flex items-center gap-2"><i class="fas fa-lightbulb text-amber-400"></i> ${uiStrings[currentLang].explanation}</div>
                        <div class="text-teal-900 text-sm leading-relaxed whitespace-pre-wrap">${isZh ? q.explanationZh : q.explanationEn}</div>
                    </div>
                `;
                expContainer.classList.remove('hidden');
            } else {
                expContainer.classList.add('hidden');
            }

            // Update Controls
            document.getElementById('prev-btn').disabled = currentQuestionIndex === 0;
            
            const nextBtn = document.getElementById('next-btn');
            const nextText = document.getElementById('ui-next-text');
            if (currentQuestionIndex === currentQuestions.length - 1) {
                nextText.innerText = uiStrings[currentLang].finish;
                nextBtn.classList.replace('bg-teal-500', 'bg-rose-500');
                nextBtn.classList.replace('hover:bg-teal-600', 'hover:bg-rose-600');
            } else {
                nextText.innerText = uiStrings[currentLang].next;
                nextBtn.classList.replace('bg-rose-500', 'bg-teal-500');
                nextBtn.classList.replace('hover:bg-rose-600', 'hover:bg-teal-600');
            }
        }

        function selectAnswer(selectedIndex) {
            userAnswers[currentQuestionIndex] = selectedIndex;
            updateQuestionSelector(); // To show checkmark
            renderQuestion(); // Re-render to show correct/wrong state and explanation
        }

        function jumpToQuestion(index) {
            currentQuestionIndex = parseInt(index);
            renderQuestion();
        }

        document.getElementById('prev-btn').onclick = () => {
            if (currentQuestionIndex > 0) {
                currentQuestionIndex--;
                renderQuestion();
            }
        };

        document.getElementById('next-btn').onclick = () => {
            if (currentQuestionIndex < currentQuestions.length - 1) {
                currentQuestionIndex++;
                renderQuestion();
            } else {
                finishQuiz();
            }
        };

        function finishQuiz() {
            const unanswered = userAnswers.filter(a => a === null).length;
            if (unanswered > 0) {
                const msg = uiStrings[currentLang].confirmFinish.replace('{unanswered}', unanswered);
                if (!confirm(msg)) return;
            }
            showResults();
        }

        // --- RESULT VIEW ---
        function showResults() {
            hideAllViews();
            currentView = 'result';
            document.getElementById('result-view').classList.remove('hidden');
            document.getElementById('back-btn').onclick = () => {
                showRangeView(currentRangeTargetId, currentRangeTitleZh, currentRangeTitleEn);
            };

            score = 0;
            const wrongQuestions = [];
            
            currentQuestions.forEach((q, idx) => {
                if (userAnswers[idx] === q.answer) {
                    score++;
                } else {
                    wrongQuestions.push({ question: q, userAns: userAnswers[idx], globalIndex: currentGlobalOffset + idx + 1 });
                }
            });

            document.getElementById('final-score').innerText = `${score} / ${currentQuestions.length}`;

            const wrongListEl = document.getElementById('wrong-questions-list');
            wrongListEl.innerHTML = '';
            
            if (wrongQuestions.length > 0) {
                document.getElementById('download-wrong-buttons').classList.remove('hidden');
                document.getElementById('wrong-questions-section').classList.remove('hidden');
                
                const isZh = currentLang === 'zh';
                wrongQuestions.forEach(wq => {
                    const qText = isZh ? wq.question.questionZh : wq.question.questionEn;
                    const opts = isZh ? wq.question.optionsZh : wq.question.optionsEn;
                    const exp = isZh ? wq.question.explanationZh : wq.question.explanationEn;
                    const uAnsText = wq.userAns !== null ? opts[wq.userAns] : uiStrings[currentLang].unanswered;
                    const cAnsText = opts[wq.question.answer];

                    const item = document.createElement('div');
                    item.className = "bg-slate-50 p-4 rounded-xl border border-slate-200 text-left";
                    
                    let imgHTML = '';
                    if (wq.question.image) {
                        const reviewImageSource = pdfImagePngMap.get(wq.question.image) || wq.question.image;
                        imgHTML = `<div class="my-3 p-3 bg-white rounded border border-slate-100 inline-block"><img src="${reviewImageSource}" class="max-h-40 rounded" alt="Image"></div>`;
                    }

                    const letters = ['A', 'B', 'C', 'D'];
                    let optionsHTML = '<div class="space-y-2 mb-4">';
                    opts.forEach((optText, index) => {
                        let optClass = "p-3 rounded-xl border-2 border-slate-200 bg-white text-slate-700 flex gap-3 items-center";
                        let iconHTML = "";
                        if (index === wq.question.answer) {
                            optClass = "p-3 rounded-xl border-2 border-emerald-400 bg-emerald-50 text-emerald-800 flex gap-3 items-center";
                            iconHTML = `<i class="fas fa-check-circle ml-auto text-xl text-emerald-600"></i>`;
                        } else if (index === wq.userAns) {
                            optClass = "p-3 rounded-xl border-2 border-rose-400 bg-rose-50 text-rose-800 flex gap-3 items-center";
                            iconHTML = `<i class="fas fa-times-circle ml-auto text-xl text-rose-600"></i>`;
                        } else {
                            optClass = "p-3 rounded-xl border-2 border-slate-200 bg-white text-slate-500 flex gap-3 items-center opacity-70";
                        }
                        optionsHTML += `<div class="${optClass}"><span class="font-bold w-6 shrink-0">${letters[index]}.</span> <span>${optText}</span>${iconHTML}</div>`;
                    });
                    optionsHTML += '</div>';

                    item.innerHTML = `
                        <p class="font-bold text-slate-800 mb-3 text-lg">Q${wq.globalIndex}. ${qText}</p>
                        ${imgHTML}
                        ${optionsHTML}
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 mb-3 text-sm">
                            <div class="bg-rose-100/50 text-rose-700 p-2 rounded-lg border border-rose-200"><span class="font-bold">${uiStrings[currentLang].yourAns}:</span> ${uAnsText}</div>
                            <div class="bg-emerald-100/50 text-emerald-700 p-2 rounded-lg border border-emerald-200"><span class="font-bold">${uiStrings[currentLang].correctAns}:</span> ${cAnsText}</div>
                        </div>
                        <div class="text-sm text-slate-600 bg-white p-3 rounded-lg border border-slate-200">
                            <span class="font-bold text-teal-600">${uiStrings[currentLang].explanation}:</span><br>
                            ${exp}
                        </div>
                    `;
                    wrongListEl.appendChild(item);
                });
            } else {
                document.getElementById('download-wrong-buttons').classList.add('hidden');
                document.getElementById('wrong-questions-section').classList.add('hidden');
            }
        }

        function downloadWrongQuestionsTXT() {
            const wrongQuestions = [];
            currentQuestions.forEach((q, idx) => {
                if (userAnswers[idx] !== q.answer) {
                    wrongQuestions.push({ question: q, userAns: userAnswers[idx], globalIndex: currentGlobalOffset + idx + 1 });
                }
            });

            if (wrongQuestions.length === 0) {
                showModal(uiStrings[currentLang].noWrongQuestions);
                return;
            }

            const isZh = currentLang === 'zh';
            let txtContent = `${isZh ? currentRangeTitleZh : currentRangeTitleEn} - ${uiStrings[currentLang].wrongTitle}\n`;
            txtContent += `=========================================\n\n`;

            wrongQuestions.forEach(wq => {
                const qText = isZh ? wq.question.questionZh : wq.question.questionEn;
                const opts = isZh ? wq.question.optionsZh : wq.question.optionsEn;
                const exp = isZh ? wq.question.explanationZh : wq.question.explanationEn;
                const letters = ['A', 'B', 'C', 'D'];
                
                let uAnsStr = wq.userAns !== null ? `${letters[wq.userAns]}. ${opts[wq.userAns]}` : uiStrings[currentLang].unanswered;
                let cAnsStr = `${letters[wq.question.answer]}. ${opts[wq.question.answer]}`;

                txtContent += `Q${wq.globalIndex}. ${qText}\n\n`;
                if(wq.question.image) {
                     txtContent += `[${isZh ? '包含圖片/結構圖，請參考應用程式' : 'Contains image/structural formula, please refer to app'}]\n\n`;
                }
                
                opts.forEach((opt, i) => {
                    txtContent += `${letters[i]}. ${opt}\n`;
                });
                txtContent += `\n`;
                txtContent += `${uiStrings[currentLang].yourAns}: ${uAnsStr}\n`;
                txtContent += `${uiStrings[currentLang].correctAns}: ${cAnsStr}\n\n`;
                txtContent += `${uiStrings[currentLang].explanation}:\n${exp}\n`;
                txtContent += `-----------------------------------------\n\n`;
            });

            const blob = new Blob([txtContent], { type: "text/plain;charset=utf-8" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = `Wrong_Questions_${new Date().getTime()}.txt`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        async function downloadWrongQuestionsPDF() {
            const wrongItems = Array.from(document.querySelectorAll('#wrong-questions-list > div'));
            if (wrongItems.length === 0) {
                showModal(uiStrings[currentLang].noWrongQuestions);
                return;
            }

            const pdfButton = document.getElementById('download-wrong-pdf-btn');
            const originalButtonHTML = pdfButton.innerHTML;
            let captureRoot = null;

            try {
                if (!window.html2canvas || !window.jspdf || !window.jspdf.jsPDF) {
                    throw new Error('PDF export libraries are unavailable.');
                }

                pdfButton.disabled = true;
                pdfButton.innerHTML = `<i class="fas fa-spinner fa-spin"></i> <span>${uiStrings[currentLang].preparingPDF}</span>`;

                if (document.fonts && document.fonts.ready) {
                    await document.fonts.ready;
                }

                const { jsPDF } = window.jspdf;
                const pdf = new jsPDF({
                    orientation: 'portrait',
                    unit: 'mm',
                    format: 'a4',
                    compress: true
                });

                const pageWidth = pdf.internal.pageSize.getWidth();
                const pageHeight = pdf.internal.pageSize.getHeight();
                const margin = 12;
                const imageWidth = pageWidth - (margin * 2);
                const availableHeight = pageHeight - (margin * 2);
                let isFirstPage = true;

                captureRoot = document.createElement('div');
                captureRoot.setAttribute('aria-hidden', 'true');
                captureRoot.style.cssText = 'position:fixed;left:-10000px;top:0;width:776px;background:#fff;pointer-events:none;';
                document.body.appendChild(captureRoot);

                for (const item of wrongItems) {
                    const capturePage = document.createElement('div');
                    capturePage.style.cssText = 'width:776px;padding:28px;background:#fff;box-sizing:border-box;';
                    capturePage.appendChild(item.cloneNode(true));
                    captureRoot.appendChild(capturePage);

                    const images = Array.from(capturePage.querySelectorAll('img'));
                    await Promise.all(images.map(async img => {
                        if (!img.complete || img.naturalWidth === 0) {
                            await new Promise(resolve => {
                                img.addEventListener('load', resolve, { once: true });
                                img.addEventListener('error', resolve, { once: true });
                            });
                        }
                    }));

                    const capturePageRect = capturePage.getBoundingClientRect();
                    const imageOverlays = images
                        .filter(img => img.complete && img.naturalWidth > 0)
                        .map(img => {
                            const rect = img.getBoundingClientRect();
                            return {
                                dataUrl: img.src,
                                x: rect.left - capturePageRect.left,
                                y: rect.top - capturePageRect.top,
                                width: rect.width,
                                height: rect.height
                            };
                        });

                    const canvas = await window.html2canvas(capturePage, {
                        scale: 2,
                        useCORS: true,
                        backgroundColor: '#ffffff',
                        logging: false,
                        windowWidth: capturePage.scrollWidth,
                        windowHeight: capturePage.scrollHeight
                    });
                    const captureScaleX = canvas.width / capturePage.scrollWidth;
                    const captureScaleY = canvas.height / capturePage.scrollHeight;
                    captureRoot.removeChild(capturePage);

                    const pixelsPerMillimetre = canvas.width / imageWidth;
                    const maxSliceHeight = Math.max(1, Math.floor(availableHeight * pixelsPerMillimetre));

                    for (let sourceY = 0; sourceY < canvas.height; sourceY += maxSliceHeight) {
                        const sliceHeight = Math.min(maxSliceHeight, canvas.height - sourceY);
                        const sliceCanvas = document.createElement('canvas');
                        sliceCanvas.width = canvas.width;
                        sliceCanvas.height = sliceHeight;
                        const sliceContext = sliceCanvas.getContext('2d');
                        sliceContext.fillStyle = '#ffffff';
                        sliceContext.fillRect(0, 0, sliceCanvas.width, sliceCanvas.height);
                        sliceContext.drawImage(
                            canvas,
                            0, sourceY, canvas.width, sliceHeight,
                            0, 0, canvas.width, sliceHeight
                        );

                        if (!isFirstPage) pdf.addPage();
                        isFirstPage = false;

                        const renderedHeight = sliceHeight / pixelsPerMillimetre;
                        pdf.addImage(
                            sliceCanvas.toDataURL('image/jpeg', 0.94),
                            'JPEG',
                            margin,
                            margin,
                            imageWidth,
                            renderedHeight,
                            undefined,
                            'FAST'
                        );

                        // Add each question diagram as a separate PNG object in jsPDF.
                        // It no longer depends on html2canvas or canvas image capture.
                        imageOverlays.forEach(overlay => {
                            const overlayTop = overlay.y * captureScaleY;
                            if (overlayTop >= sourceY && overlayTop < sourceY + sliceHeight) {
                                pdf.addImage(
                                    overlay.dataUrl,
                                    'PNG',
                                    margin + ((overlay.x * captureScaleX) / pixelsPerMillimetre),
                                    margin + ((overlayTop - sourceY) / pixelsPerMillimetre),
                                    (overlay.width * captureScaleX) / pixelsPerMillimetre,
                                    (overlay.height * captureScaleY) / pixelsPerMillimetre,
                                    undefined,
                                    'FAST'
                                );
                            }
                        });
                    }
                }

                const exportStamp = new Date().toISOString().replace(/\D/g, '').slice(0, 14);
                pdf.save(currentLang === 'zh' ? `錯題本_${exportStamp}.pdf` : `wrong_questions_${exportStamp}.pdf`);
            } catch (error) {
                console.error(error);
                showModal(uiStrings[currentLang].pdfDownloadError);
            } finally {
                if (captureRoot && captureRoot.parentNode) {
                    captureRoot.parentNode.removeChild(captureRoot);
                }
                pdfButton.disabled = false;
                pdfButton.innerHTML = originalButtonHTML;
            }
        }

        // Initialize App
        updateUI();
        showSubtopicsView();
    </script>
</body>
